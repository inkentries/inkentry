# Proves SCOOP_BUCKET_TOKEN can read and write inkentries/scoop-inkentry,
# without publishing anything.
#
# The release job that uses the token only runs on stable tags, so without this
# its first exercise would be the 1.0.0 tag itself — and a scope problem would
# surface after the release was already published.
#
# Deliberately a separate workflow rather than a trigger on release.yml: adding
# one there would make every release job runnable on demand, including the one
# that publishes a GitHub release.
name: Scoop bucket token check

on:
  # Runs on the pull request branch, so a token change is proved before it
  # merges rather than after. Path-scoped because the answer only changes when
  # the check or the job that shares its token changes.
  pull_request:
    paths:
      - .github/workflows/scoop-bucket-token-check.yml
      - .github/workflows/release.yml
  # Kept so the token can be re-checked after a rotation without inventing a
  # pull request that touches those paths.
  workflow_dispatch:

jobs:
  check:
    name: Verify SCOOP_BUCKET_TOKEN against the bucket
    # Pull requests from forks receive no secrets, so the token steps would
    # fail for a reason that has nothing to do with the token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Fails here if the token is missing, expired, or not scoped to the
      # bucket — the same step, with the same inputs, that release.yml runs.
      - name: Checkout scoop-inkentry bucket
        uses: actions/checkout@v7
        with:
          repository: inkentries/scoop-inkentry
          path: bucket-repo
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Confirm the manifest is where the release job writes it
        working-directory: bucket-repo
        run: |
          set -euo pipefail
          test -f bucket/inkentry.json
          node -e 'JSON.parse(require("fs").readFileSync("bucket/inkentry.json","utf8"))'
          echo "bucket/inkentry.json present and parses"

      # Read access is not enough: a fine-grained token can clone a public repo
      # and still be unable to push. `--dry-run` performs the authorization
      # exchange and stops before writing a ref.
      - name: Confirm the token is authorised to push
        working-directory: bucket-repo
        run: |
          set -euo pipefail
          git push --dry-run origin HEAD:main
          echo "push authorised — release.yml can update the bucket"
