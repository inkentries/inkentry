name: Version skew

# Runs the support window in docs/version-skew.md against real artifacts.
#
# Every other contract test in this repo talks to a mock or to a fixture
# written to the shape we believe a peer has, so none of them can falsify that
# belief. This job is the exception: it puts the current build and the previous
# *released* build on a socket together and drives the end-to-end memory flow
# in both directions. It is deliberately its own workflow rather than a job
# bolted onto ci.yml, so a skew break reads as a skew break.
#
# The `/v1/` schema half of the contract is covered elsewhere and is not
# repeated here: `openapi-snapshot` in ci.yml regenerates the spec from the
# running binary and diffs it against docs/openapi.json.
#
# WHAT IT COMPARES AGAINST: the newest published release that carries this
# version's major and is not the version in this tree. The window stops at the
# major boundary, and that is a decision rather than a convenience.
#
# 1.0 is a clean break. A store written by an earlier build is refused or
# rebuilt rather than migrated, and the porcelain this job's script drives
# (`memory push`, `memory pull`, `memory search`) was removed there. The last
# 0.9 release cannot be driven by those commands at all, so covering it would
# mean keeping a removed surface alive inside the test harness for the sole
# purpose of testing a pairing nothing promises. What this job does assert is
# what the stability contract actually promises: additive evolution inside one
# major version. A red raised across the boundary would be reporting a break
# that was chosen rather than one that regressed, and a red nobody can act on
# is a red nobody reads.
#
# A major whose only release is the version in this tree has no predecessor to
# put on the socket. The job says so and stops, rather than failing: nothing
# was built that it could have tested. That state lasts from the version bump
# until the second release of that major, and the run summary names it so it
# cannot pass for coverage.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The OS keychain is unavailable in headless runners.
  INKENTRY_SECRET_STORE: file

jobs:
  binary-skew:
    name: Current build against the previous release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      # Wall-clock bound on the smoke test's wait for the server-side embedder.
      # The script fails rather than skipping the search step if this expires,
      # so the model cache below is what makes it reachable.
      SKEW_EMBEDDER_TIMEOUT_SECS: 300
      # The script runs the server under an isolated HOME, so its model cache
      # is cold unless pointed somewhere that outlives the run. Only the model
      # download lives here; config, registry and secret store stay isolated.
      SKEW_MODEL_CACHE: ${{ github.workspace }}/.skew-model-cache/models
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      # See ci.yml's `test` job for why this is Swatinem/rust-cache rather
      # than a hand-rolled `actions/cache` with a version-prefixed key.
      - name: Cache
        uses: Swatinem/rust-cache@v2

      # The previous release is the newest published tag carrying this version's
      # major that is not the version in this tree. The major filter is the
      # window decision at the top of this file, made executable: without it
      # this resolves to whatever was published last, which crosses the major
      # boundary the moment a release sits on the other side of it. Excluding
      # the current version keeps a just-tagged release from being compared
      # against itself, which the smoke script's own equal-version guard would
      # otherwise fail for a confusing reason.
      #
      # Each grep is allowed to match nothing: under `pipefail` an unmatched
      # grep would otherwise abort the step rather than leave `prev` empty,
      # turning the documented no-predecessor case into an opaque failure.
      - name: Resolve the previous released version
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "inkentry-cli") | .version')"
          major="${current%%.*}"
          echo "current version: $current (major $major)"

          prev="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName \
            --jq '.[].tagName' \
            | { grep -E "^v${major}\." || true; } \
            | { grep -v "^v${current}$" || true; } \
            | head -n 1)"

          if [ -z "$prev" ]; then
            echo "no release in major $major other than $current; the skew window starts here"
            {
              echo "### No skew run"
              echo
              echo "\`$current\` is the only release in major \`$major\`, so there is no"
              echo "previously released peer to put on a socket with it. This job resumes"
              echo "at the next release of this major."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "previous release: $prev"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: Download the previous release
        if: steps.prev.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail
          # Named for what this repo's releases publish. Unlike the pinned 0.9.x
          # assets in upgrade-corpus.yml, this is not a reference to a specific
          # historical artifact: it resolves to whatever the previous release
          # was, so it tracks the current naming rather than preserving an old
          # one.
          asset="inkentry-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p prev-release

          # This job downloads and then *executes* a binary, so the download is
          # pinned to the digest the release itself publishes rather than
          # trusted on the strength of having come from the right URL.
          expected="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq ".assets[] | select(.name == \"${asset}\") | .digest")"
          if [ -z "$expected" ]; then
            echo "ERROR: release $TAG publishes no asset named $asset" >&2
            exit 1
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir prev-release
          actual="sha256:$(sha256sum "prev-release/${asset}" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "ERROR: digest mismatch for $asset" >&2
            echo "  expected: $expected" >&2
            echo "  actual:   $actual" >&2
            exit 1
          fi
          echo "digest verified: $actual"

          tar -xzf "prev-release/${asset}" -C prev-release
          chmod +x prev-release/inkentry prev-release/inkentry-server
          # Explicit on the command rather than relying on the job-level env,
          # because this runner has a dbus keyring installed for the build and
          # a released binary must never be the one that finds it.
          INKENTRY_SECRET_STORE=file ./prev-release/inkentry --version
          INKENTRY_SECRET_STORE=file ./prev-release/inkentry-server --version

      - name: Build the current binaries
        if: steps.prev.outputs.tag != ''
        run: cargo build --release -p inkentry-cli -p inkentry-server --bins

      - name: Cache the embedder model
        if: steps.prev.outputs.tag != ''
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.skew-model-cache
          key: ${{ runner.os }}-skew-embedder-model-v1

      # Downloading the model here rather than inside the skew runs keeps the
      # failure attributable: a model that will not load is a warm-up failure,
      # not a version-skew break. It also means the smoke runs below start from
      # a warm cache, which is the difference between the search step running
      # and the job failing for having skipped it.
      - name: Warm the embedder model cache
        if: steps.prev.outputs.tag != ''
        run: |
          set -euo pipefail
          # Linked into place the same way the smoke script does it, so both
          # populate and read one directory.
          warm_data="$RUNNER_TEMP/warm-home/.local/share"
          mkdir -p "$SKEW_MODEL_CACHE" "$warm_data/inkentry"
          ln -sfn "$SKEW_MODEL_CACHE" "$warm_data/inkentry/models"

          HOME="$RUNNER_TEMP/warm-home" XDG_DATA_HOME="$warm_data" \
            INKENTRY_SECRET_STORE=file \
            target/release/inkentry-server --port 7999 --db "$RUNNER_TEMP/warm.db" \
            >"$RUNNER_TEMP/warm.log" 2>&1 &
          warm_pid=$!
          trap 'kill "$warm_pid" 2>/dev/null || true' EXIT

          deadline=$(( $(date +%s) + 900 ))
          state=unknown
          while [ "$(date +%s)" -lt "$deadline" ]; do
            state="$(curl -sf -m 5 http://127.0.0.1:7999/v1/health \
              | jq -r '.embedder.state // "unknown"' 2>/dev/null || echo unknown)"
            case "$state" in
              loading|unknown) ;;
              *) break ;;
            esac
            sleep 5
          done
          echo "embedder state after warm-up: $state"
          if [ "$state" != "ready" ]; then
            cat "$RUNNER_TEMP/warm.log" >&2
            echo "ERROR: embedder never became ready; the skew runs would have to skip search" >&2
            exit 1
          fi

      - name: Current CLI against the previous released server
        if: steps.prev.outputs.tag != ''
        run: |
          ./scripts/skew-smoke.sh \
            target/release/inkentry \
            prev-release/inkentry-server

      - name: Previous released CLI against the current server
        if: steps.prev.outputs.tag != ''
        run: |
          ./scripts/skew-smoke.sh \
            prev-release/inkentry \
            target/release/inkentry-server
