name: PR Release Test

# No-release counterpart to release.yml, for validating the llama.cpp engine on
# real hardware before it is sanctioned for a release. It runs the GPU build
# matrix — Vulkan on x64 Linux/Windows, llama.cpp Metal on macOS, llama.cpp CPU
# on arm64 Linux — stamps every binary with a `-pr` version, and uploads a
# per-target archive as a run artifact instead of cutting a GitHub Release. No
# .deb / Homebrew / Scoop: those belong to a real release.
#
# Triggered like CI (every pull request, plus pushes to main) rather than by
# manual dispatch, so a `pull_request` build runs from the head branch's own
# copy of this file — which is why it rides on the branch under test rather than
# living on main. The matrix hard-codes the llama engine features, so a build
# only succeeds on a ref that defines them; on a ref without them the build step
# fails fast at `cargo build --features`.
#
# Purpose is temporary: this exists to decide llama vs candle for v1.1. If the
# builds pass across the hardware fleet, v1.1 goes llama-only and this becomes
# the release path; if they don't, llama is dropped and this file goes with it.
on:
  push:
    branches: ["main"]
  pull_request:

# A 4-platform GPU build is expensive; a newer push to the same ref supersedes
# the older run rather than letting both burn runner time.
concurrency:
  group: pr-release-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  # Derive the version once and hand it to every downstream job so the archive
  # name and the version compiled into the binary agree.
  version:
    name: Compute -pr version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pr_version: ${{ steps.compute.outputs.pr_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Base version is whatever the branch already carries in Cargo.toml (the
      # release line it is stacked on); the `-pr.<run>.g<sha>` pre-release ties
      # each build back to the run and commit it came from — what the fleet
      # needs to tell one matrix build apart from the next.
      - id: compute
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(grep -m1 '^version = ' crates/inkentry-cli/Cargo.toml \
            | sed -E 's/^version = "([^"]+)".*/\1/')"
          if [ -z "$BASE" ]; then
            echo "::error::could not read base version from crates/inkentry-cli/Cargo.toml"
            exit 1
          fi
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PR_VERSION="${BASE}-pr.${{ github.run_number }}.g${SHORT_SHA}"
          echo "pr_version=${PR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "PR version: ${PR_VERSION}"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    # Linux builds run inside an ubuntu:22.04 (jammy) container so the binaries
    # link against glibc 2.35, the supported floor (Ubuntu 22.04+ / Debian 12+).
    # Building on the runner's own userland (24.04, glibc 2.39) is what made
    # earlier releases crash on the floor distros. An empty `container` means
    # the job runs directly on the runner VM (macOS, Windows).
    container: ${{ matrix.container }}
    # No Actions cache here: a dynamic-backends llama.cpp build poisons a
    # restored cache (a wedged sys build dir, and dangling hard-links the
    # re-link panics on), so these throwaway builds start clean every time and
    # trade build time for reliability.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PR_VERSION: ${{ needs.version.outputs.pr_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu:22.04 (Jammy) = glibc 2.35 floor (Ubuntu 22.04+ / Debian 12+).
          #
          # llama: true adds the llama.cpp Vulkan engine (server feature
          # `llama-vulkan`): the Vulkan SDK is installed at build time, and the
          # archive gains the engine's core shared libs plus its runtime-loaded
          # ggml backend modules next to the binaries. x64 Linux and Windows
          # only: LunarG ships no arm64-linux SDK, and macOS uses Metal. The
          # rpath makes the binary find its libs beside itself (the flat
          # archive); Windows resolves DLLs from the exe directory natively.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: rich-formats,llama-vulkan
            container: ubuntu:22.04
            llama: true
            rustflags: "-C link-arg=-Wl,-rpath,$ORIGIN:$ORIGIN/../lib/inkentry"
          # Native arm64 runner (free for public repos) + arm64 jammy container.
          # embed-llama without a GPU flavor = the llama.cpp CPU engine,
          # statically linked (no SDK, no extra files): where Vulkan can't go
          # (LunarG ships no arm64-linux SDK), llama.cpp CPU is still the faster
          # engine, with candle as the in-binary fallback.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: rich-formats,embed-llama
            container: ubuntu:22.04
          # macOS exercises the llama.cpp Metal engine (llama-metal), not the
          # candle Metal path release.yml still ships — this workflow is the
          # cross-platform test of the one engine. Metal links statically (no
          # dynamic-backends), so the archive is just the two binaries.
          - os: macos-latest
            target: aarch64-apple-darwin
            features: rich-formats,llama-metal
          # Pinned to windows-2022 (VS 2022), not windows-latest: the latter now
          # carries a "Visual Studio 18 2026" preview whose MSBuild custom-build
          # step breaks ggml-vulkan's nested vulkan-shaders-gen ExternalProject
          # ("The system cannot find the batch label specified - VCEnd"). VS 2022
          # is the toolchain llama.cpp ships Windows Vulkan on.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            features: rich-formats,llama-vulkan
            llama: true

    steps:
      # Inside the jammy container nothing is preinstalled. git must be present
      # before actions/checkout so it does a real clone; curl + ca-certificates
      # are for rustup; libdbus-1-dev + pkg-config are for the keyring crate's
      # sync-secret-service feature (links libdbus, a C lib); cmake builds
      # llama.cpp (jammy's 3.22 satisfies ggml's >= 3.19) and libclang-dev feeds
      # bindgen's FFI generation (both Linux legs carry a llama engine feature;
      # runner VMs have LLVM preinstalled, bare containers have neither).
      # Noninteractive: tzdata prompts otherwise.
      - name: Install build dependencies (Linux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config libdbus-1-dev \
            cmake libclang-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable (Linux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          # rustfmt: bindgen formats its generated FFI bindings with it and
          # prints a spurious "error:" line when it is missing.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The llama-vulkan feature needs the Vulkan SDK at BUILD time only: glslc
      # compiles the ggml shaders, the headers/loader are linked against.
      # Nothing Vulkan is a runtime requirement of the shipped binary — the
      # Vulkan backend is a dlopen'd module that fails to load (and degrades to
      # CPU) on machines without a driver. Pinned by version + sha256; jammy's
      # own vulkan packages are too old, hence the SDK tarball.
      - name: Install Vulkan SDK (Linux container)
        if: matrix.container != '' && matrix.llama
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # libvulkan-dev: the SDK tarball ships headers + glslc but no prebuilt
          # loader; linking needs only the loader's stable entrypoints (ggml
          # uses dynamic dispatch), so jammy's own loader satisfies
          # Vulkan_LIBRARY. Runtime uses the end user's system loader regardless.
          apt-get install -y --no-install-recommends xz-utils libvulkan-dev
          # The SDK's glslc binary itself must RUN in this container: LunarG
          # builds it against glibc 2.34, inside the 2.35 floor. Check that
          # before any future SDK bump that outpaces the floor.
          SDK_VERSION="1.4.357.1"
          SDK_SHA256="4b41e3b30e8aedaa5dac7c136561ab463eb316a25a54e2c6245f2c299ea1fb85"
          curl -fsSL -o /tmp/vulkansdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz"
          echo "${SDK_SHA256}  /tmp/vulkansdk.tar.xz" | sha256sum -c -
          mkdir -p /opt/vulkansdk
          tar -xf /tmp/vulkansdk.tar.xz -C /opt/vulkansdk
          rm /tmp/vulkansdk.tar.xz
          echo "VULKAN_SDK=/opt/vulkansdk/${SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          # find_package(SPIRV-Headers CONFIG) resolves via the SDK's
          # share/cmake, which only CMAKE_PREFIX_PATH makes visible.
          echo "CMAKE_PREFIX_PATH=/opt/vulkansdk/${SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "/opt/vulkansdk/${SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"

      # One command per step (Windows steps must not chain rustup invocations).
      - name: Install Rust toolchain (runner VM)
        if: matrix.container == ''
        run: rustup toolchain install stable --no-self-update

      # Same build-time-only Vulkan SDK as the Linux step above; the Qt
      # installer framework's silent mode needs the three flags exactly.
      # LunarG's Windows installer is vulkan-sdk.exe (not the Linux tarball's
      # name), and its latest 1.4.357 Windows build is .0 — the .1 respin is
      # Linux-only, so Windows pins its own version. curl.exe returning non-zero
      # does not stop pwsh on its own, so guard it explicitly: without the guard
      # a failed download surfaces only as a confusing Get-FileHash "path not
      # found" on the next line.
      - name: Download Vulkan SDK (Windows)
        if: matrix.llama && runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.4.357.0"
          $url = "https://sdk.lunarg.com/sdk/download/$v/windows/vulkan-sdk.exe"
          curl.exe -fsSL -o vulkansdk.exe $url
          if ($LASTEXITCODE -ne 0) { throw "vulkan-sdk.exe download failed (curl exit $LASTEXITCODE): $url" }
          $expected = "81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d"
          $actual = (Get-FileHash vulkansdk.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "vulkansdk.exe sha256 mismatch: $actual" }

      - name: Install Vulkan SDK (Windows)
        if: matrix.llama && runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath .\vulkansdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = "C:\VulkanSDK\1.4.357.0"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK install did not produce $sdk\Bin\glslc.exe" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Rust target (runner VM)
        if: matrix.container == ''
        run: rustup target add ${{ matrix.target }}

      # CARGO_PKG_VERSION is baked into the binary at compile time, so stamping
      # every workspace crate here is what makes `inkentry --version` report the
      # `-pr` build on the fleet — the whole point of this workflow. Only the
      # first `version = "…"` line (the [package] version) in each crate is
      # touched; the inter-crate path deps carry no version requirement, so
      # nothing else has to move. perl is present on every runner and in the
      # jammy container (perl-base), unlike GNU-only sed address ranges.
      - name: Stamp -pr version into Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          for crate in inkentry-core inkentry-embed inkentry-cli inkentry-server; do
            f="crates/${crate}/Cargo.toml"
            perl -pi -e 'if (!$d && /^version = "/) { s/"[^"]*"/"$ENV{PR_VERSION}"/; $d=1 }' "$f"
          done
          grep -m1 -H '^version = ' crates/*/Cargo.toml

      - name: Build release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Single-quoted: $ORIGIN must reach the linker literally.
          if [ -n '${{ matrix.rustflags }}' ]; then
            export RUSTFLAGS='${{ matrix.rustflags }}'
          fi
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Windows Vulkan builds with the Visual Studio generator break on ggml's
      # nested vulkan-shaders-gen ExternalProject: its MSBuild custom-build step
      # fails the compiler probe ("batch label VCEnd" / C1083 empty file), on
      # both VS 2022 and the VS 2026 preview. Build with Ninja — the generator
      # llama.cpp uses on Windows, which runs the sub-build directly instead of
      # through the custom-build wrapper. Ninja needs the MSVC toolchain on PATH,
      # so source vcvars64 first; cmake-rs honors CMAKE_GENERATOR. The windows
      # leg carries no rustflags, so none are exported here.
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CMAKE_GENERATOR: Ninja
          # ggml's nested vulkan-shaders-gen ExternalProject probe compiles with
          # /Zi, and its parallel C/CXX ABI checks share one vc140.pdb (fatal
          # error C1041). That nested probe never sees the outer build's /FS, so
          # inject it through cl.exe's own CL variable, which every cl.exe
          # invocation honors — including the sub-build's.
          CL: /FS
        run: |
          set "PF86=%ProgramFiles(x86)%"
          for /f "usebackq tokens=*" %%i in (`"%PF86%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH ( echo could not locate Visual Studio via vswhere & exit /b 1 )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"

      # A dynamic-backends build splits the llama engine into the binary, four
      # core shared libs it links by SONAME, and dlopen'd ggml backend modules.
      # All of them ship next to the binaries; see the script for the layout.
      - name: Collect llama runtime libraries
        if: matrix.llama
        shell: bash
        run: |
          set -euo pipefail
          scripts/collect-ggml-backends.sh \
            "target/${{ matrix.target }}/release" \
            "target/${{ matrix.target }}/release"

      # The modules keep cmake's full symbol tables (cargo's `strip` profile
      # setting only reaches rust-linked artifacts); the Vulkan module alone
      # is ~50 MB unstripped.
      - name: Strip llama runtime libraries (Linux)
        if: matrix.llama && matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          strip --strip-unneeded target/${{ matrix.target }}/release/lib*.so*

      # Fail the build if any shipped ELF needs a glibc symbol newer than the
      # 2.35 floor. Pinned forever, not measured once: must keep failing even
      # after toolchain bumps. A missing, empty, or non-numeric ceiling is
      # treated as a broken check, never as proof of compliance (a bare
      # GLIBC_PRIVATE match, or no GLIBC_ symbols at all, would otherwise slip
      # through as a false pass).
      - name: Enforce glibc ceiling (Linux)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          shipped="inkentry inkentry-server"
          # The llama legs also ship shared objects; every ELF in the archive
          # must honor the same floor, or the engine silently dies on exactly
          # the distros the floor exists for.
          if [ -n "${{ matrix.llama }}" ]; then
            shipped="$shipped $(cd "target/${{ matrix.target }}/release" && ls lib*.so*)"
          fi
          for bin in $shipped; do
            path="target/${{ matrix.target }}/release/${bin}"
            raw="$(objdump -T "$path")"
            ceiling="$(printf '%s\n' "$raw" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 || true)"
            if ! [[ "$ceiling" =~ ^GLIBC_[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${bin}: no valid versioned GLIBC symbol found (got '${ceiling}')"
              exit 1
            fi
            echo "${bin}: max versioned glibc symbol = ${ceiling}"
            max="$(printf '%s\nGLIBC_2.35\n' "$ceiling" | sort -V | tail -1)"
            if [ "$max" != "GLIBC_2.35" ]; then
              echo "::error::${bin} requires ${ceiling}, above the glibc 2.35 floor"
              exit 1
            fi
          done

      - name: Package tarball (unix)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${PR_VERSION}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="inkentry-${VERSION}-${TARGET}.tar.gz"
          # Flat archive; llama legs add the engine's shared libs and modules.
          extra=""
          if [ -n "${{ matrix.llama }}" ]; then
            extra="$(cd "target/${TARGET}/release" && ls lib*.so*)"
          fi
          # shellcheck disable=SC2086  # word-splitting $extra is the point
          tar -czf "${ARCHIVE}" \
            -C "target/${TARGET}/release" \
            inkentry inkentry-server ${extra}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package zip (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $VERSION  = "${env:PR_VERSION}"
          $TARGET   = "${{ matrix.target }}"
          $ARCHIVE  = "inkentry-${VERSION}-${TARGET}.zip"
          $binaries = @(
            "target\${TARGET}\release\inkentry.exe",
            "target\${TARGET}\release\inkentry-server.exe"
          )
          # llama leg: the engine's core DLLs + dlopen'd ggml backend modules.
          $libs = Get-ChildItem "target\${TARGET}\release" |
            Where-Object { $_.Name -match '^(ggml|llama).*\.dll$' } |
            ForEach-Object { $_.FullName }
          Compress-Archive -Path ($binaries + $libs) -DestinationPath $ARCHIVE
          "ARCHIVE=${ARCHIVE}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 7-day retention: these are throwaway fleet-test builds, not releases, so
      # expire them well before the 90-day default and keep artifact storage
      # from filling up with superseded runs.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkentry-${{ env.PR_VERSION }}-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # Run the Linux tarballs on the support floor. Non-blocking: this is a signal,
  # not a gate — the build artifacts are already uploaded by the `build` job, and
  # a headless CI container is not the GPU/Vulkan fleet these builds are for, so
  # a failure here never withholds anything (the Vulkan backend simply dlopen's
  # to nothing and the engine degrades to CPU).
  tarball-smoke:
    name: Run tarball binaries on the support floor (${{ matrix.target }})
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    env:
      PR_VERSION: ${{ needs.version.outputs.pr_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inkentry-${{ env.PR_VERSION }}-${{ matrix.target }}
          path: tarball

      - name: Extract tarball
        run: |
          tar -xzf tarball/inkentry-${{ env.PR_VERSION }}-${{ matrix.target }}.tar.gz \
            -C tarball

      # Install-success proves nothing: exercise real subcommands (a git-backed
      # memory round trip included) on each floor/current image. The binaries
      # carry the llama engine's shared libs beside them ($ORIGIN rpath), so this
      # also proves they load with no Vulkan driver present.
      - name: Execute on floor and current images
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "=== ${image} ==="
            docker run --rm -v "$PWD/tarball:/t:ro" -e INKENTRY_SECRET_STORE=file "$image" bash -euc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libdbus-1-3 git ca-certificates
              test -n "$(/t/inkentry --version)"
              test -n "$(/t/inkentry-server --version)"

              mkdir -p /w && cd /w
              git init -q .
              git config user.email t@t
              git config user.name t
              echo "fn main() {}" > main.rs
              git add . && git commit -qm init

              /t/inkentry status
              /t/inkentry init --no-index
              /t/inkentry memory add --kind note --title "tarball smoke" --body "runs on this image"
              /t/inkentry memory list | grep -q "tarball smoke"
            '
          done
