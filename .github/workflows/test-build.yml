name: Test Build (temporary — remove before merge)

# Temporary workflow to verify the aarch64 cross-compilation build fix
# without going through a full release. Remove this file before merging.

on:
  push:
    branches:
      - 'release/0.8.0-arm-build-fix'
  pull_request:
    branches:
      - 'release/0.8.0-arm-build-fix'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            features: rich-formats
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            features: rich-formats
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            features: rich-formats

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binaries (native)
        if: "!matrix.cross"
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build release binaries (cross)
        if: matrix.cross
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cross build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cross build --release --target ${{ matrix.target }}
          fi
