name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            features: ""
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            features: ""
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            features: ""
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            features: ""
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            features: rich-formats
            suffix: -rich-formats
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            features: rich-formats
            suffix: -rich-formats
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
            features: rich-formats
            suffix: -rich-formats
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            features: rich-formats
            suffix: -rich-formats

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binaries (native)
        if: "!matrix.cross"
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build release binaries (cross)
        if: matrix.cross
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cross build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Strip binaries (native Linux/macOS x86_64)
        if: "!matrix.cross && matrix.target != 'aarch64-apple-darwin'"
        run: |
          strip target/${{ matrix.target }}/release/spelunk
          strip target/${{ matrix.target }}/release/spelunk-server

      - name: Package tarball
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="spelunk-${VERSION}-${TARGET}${{ matrix.suffix }}.tar.gz"
          tar -czf "${ARCHIVE}" \
            -C "target/${TARGET}/release" \
            spelunk spelunk-server
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spelunk-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
          path: ${{ env.ARCHIVE }}

  universal-macos:
    name: Build (universal-apple-darwin${{ matrix.suffix }})
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        suffix: ["", "-rich-formats"]
    steps:
      - uses: actions/checkout@v6

      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: spelunk-${{ github.ref_name }}-x86_64-apple-darwin${{ matrix.suffix }}
          path: x86_64

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v8
        with:
          name: spelunk-${{ github.ref_name }}-aarch64-apple-darwin${{ matrix.suffix }}
          path: aarch64

      - name: Extract both tarballs
        run: |
          tar -xzf x86_64/spelunk-${{ github.ref_name }}-x86_64-apple-darwin${{ matrix.suffix }}.tar.gz -C x86_64
          tar -xzf aarch64/spelunk-${{ github.ref_name }}-aarch64-apple-darwin${{ matrix.suffix }}.tar.gz -C aarch64

      - name: Create universal binaries with lipo
        run: |
          mkdir -p universal
          lipo -create -output universal/spelunk \
            x86_64/spelunk aarch64/spelunk
          lipo -create -output universal/spelunk-server \
            x86_64/spelunk-server aarch64/spelunk-server

      - name: Package universal tarball
        run: |
          VERSION="${{ github.ref_name }}"
          ARCHIVE="spelunk-${VERSION}-universal-apple-darwin${{ matrix.suffix }}.tar.gz"
          tar -czf "${ARCHIVE}" -C universal spelunk spelunk-server
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: spelunk-${{ github.ref_name }}-universal-apple-darwin${{ matrix.suffix }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Build Debian package (amd64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: spelunk-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: linux-amd64

      - name: Extract tarball
        run: |
          tar -xzf linux-amd64/spelunk-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz \
            -C linux-amd64

      - name: Assemble deb layout
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for deb version field
          DEB_VERSION="${VERSION#v}"

          mkdir -p BUILD/DEBIAN
          mkdir -p BUILD/usr/bin
          mkdir -p BUILD/usr/lib/systemd/user

          # Binaries
          install -m 755 linux-amd64/spelunk        BUILD/usr/bin/spelunk
          install -m 755 linux-amd64/spelunk-server BUILD/usr/bin/spelunk-server

          # systemd user unit
          install -m 644 packaging/spelunk-server.service \
            BUILD/usr/lib/systemd/user/spelunk-server.service

          # DEBIAN/control (no leading whitespace — dpkg is strict)
          cat > BUILD/DEBIAN/control <<EOF
Package: spelunk
Version: ${DEB_VERSION}
Architecture: amd64
Maintainer: spelunk-cloud <hello@spelunk.cloud>
Depends: libc6 (>= 2.17)
Description: Code intelligence for AI agents
 spelunk provides persistent memory, a code graph, and semantic search
 for AI coding agents. Includes the spelunk CLI and spelunk-server.
Homepage: https://spelunk.cloud
EOF

          echo "DEB_VERSION=${DEB_VERSION}" >> "$GITHUB_ENV"

      - name: Build .deb
        run: |
          dpkg-deb --build BUILD "spelunk_${{ env.DEB_VERSION }}_amd64.deb"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: spelunk-${{ github.ref_name }}-amd64-deb
          path: spelunk_${{ env.DEB_VERSION }}_amd64.deb

  release:
    name: Create GitHub Release
    needs: [build, universal-macos, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -qE '\-(rc|beta|alpha)'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE \
            artifacts/*.tar.gz \
            artifacts/*.deb

  update-homebrew-formula:
    name: Update HomebrewFormula/spelunk.rb
    needs: release
    # Skip pre-release tags (rc/beta/alpha) — formula only tracks stable releases.
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Compute sha256 for each platform tarball
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for formula version field
          VER="${VERSION#v}"

          download_sha256() {
            local target="$1"
            local url="https://github.com/spelunk-cloud/spelunk/releases/download/${VERSION}/spelunk-${VERSION}-${target}.tar.gz"
            curl -fsSL "$url" | sha256sum | awk '{print $1}'
          }

          SHA_AARCH64_DARWIN="$(download_sha256 aarch64-apple-darwin)"
          SHA_X86_64_DARWIN="$(download_sha256 x86_64-apple-darwin)"
          SHA_AARCH64_LINUX="$(download_sha256 aarch64-unknown-linux-gnu)"
          SHA_X86_64_LINUX="$(download_sha256 x86_64-unknown-linux-gnu)"

          echo "SHA_AARCH64_DARWIN=${SHA_AARCH64_DARWIN}" >> "$GITHUB_ENV"
          echo "SHA_X86_64_DARWIN=${SHA_X86_64_DARWIN}"   >> "$GITHUB_ENV"
          echo "SHA_AARCH64_LINUX=${SHA_AARCH64_LINUX}"   >> "$GITHUB_ENV"
          echo "SHA_X86_64_LINUX=${SHA_X86_64_LINUX}"     >> "$GITHUB_ENV"
          echo "VER=${VER}"                                >> "$GITHUB_ENV"

      - name: Patch HomebrewFormula/spelunk.rb
        run: |
          FORMULA="HomebrewFormula/spelunk.rb"

          # Update version
          sed -i "s/^  version \".*\"/  version \"${VER}\"/" "$FORMULA"

          # Update sha256 values (match the TODO_* placeholders and real hashes)
          sed -i "s/sha256 \"TODO_aarch64_apple_darwin\"/sha256 \"${SHA_AARCH64_DARWIN}\"/" "$FORMULA"
          sed -i "s/sha256 \"TODO_x86_64_apple_darwin\"/sha256 \"${SHA_X86_64_DARWIN}\"/"   "$FORMULA"
          sed -i "s/sha256 \"TODO_aarch64_linux\"/sha256 \"${SHA_AARCH64_LINUX}\"/"         "$FORMULA"
          sed -i "s/sha256 \"TODO_x86_64_linux\"/sha256 \"${SHA_X86_64_LINUX}\"/"           "$FORMULA"

          # On subsequent runs the placeholders are gone — update real hashes directly.
          # Pattern: sha256 "..." inside the on_arm/on_intel blocks (order in file matches
          # aarch64-apple-darwin, x86_64-apple-darwin, aarch64-linux, x86_64-linux).
          python3 - <<'PYEOF'
          import re, os, sys

          formula_path = "HomebrewFormula/spelunk.rb"
          with open(formula_path) as f:
              content = f.read()

          replacements = [
              ("aarch64-apple-darwin", os.environ["SHA_AARCH64_DARWIN"]),
              ("x86_64-apple-darwin",  os.environ["SHA_X86_64_DARWIN"]),
              ("aarch64-unknown-linux-gnu", os.environ["SHA_AARCH64_LINUX"]),
              ("x86_64-unknown-linux-gnu",  os.environ["SHA_X86_64_LINUX"]),
          ]

          for target, sha in replacements:
              # Replace the sha256 line that follows the url line for this target
              pattern = (
                  r'(url "https://github\.com/spelunk-cloud/spelunk/releases/download/v[^/]+/'
                  + re.escape(f'spelunk-v') + r'[^"]*-' + re.escape(target) + r'\.tar\.gz"'
                  + r'\s+sha256 ")[0-9a-f]+(")'
              )
              content = re.sub(pattern, r'\g<1>' + sha + r'\g<2>', content)

          with open(formula_path, "w") as f:
              f.write(content)
          PYEOF

          cat "$FORMULA"

      - name: Commit and push updated formula
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/spelunk.rb
          git commit -m "chore: update Homebrew formula to v${VER}" || echo "No changes to commit"
          git push origin main
