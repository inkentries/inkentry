name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Linux builds run inside an ubuntu:22.04 (jammy) container so the
    # binaries link against glibc 2.35, the supported floor (Ubuntu 22.04+ /
    # Debian 12+; Debian 11 left support when it reached end of life,
    # 2026-08-31). Building on the runner's own userland (24.04, glibc 2.39)
    # is what made earlier releases crash on the floor distros. An empty
    # `container` means the job runs directly on the runner VM (macOS,
    # Windows).
    container: ${{ matrix.container }}
    timeout-minutes: 30
    # Builds and uploads a run artifact; the release itself is created by the
    # `release` job below, which is the only job here that needs write.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu:22.04 = glibc 2.35 floor (Ubuntu 22.04+/Debian 12+).
          # Changing this base image changes the supported floor.
          #
          # llama: true adds the llama.cpp Vulkan engine (server feature
          # `llama-vulkan`): the Vulkan SDK is installed at build time, and the
          # archive gains the engine's core shared libs plus its runtime-loaded
          # ggml backend modules next to the binaries. x64 Linux and Windows
          # only: LunarG ships no arm64-linux SDK, and macOS stays on candle
          # Metal. The rpath makes the binary find its libs beside itself
          # (tarball) or in ../lib/inkentry (the .deb split layout); Windows
          # resolves DLLs from the exe directory natively.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: rich-formats,llama-vulkan
            container: ubuntu:22.04
            llama: true
            rustflags: "-C link-arg=-Wl,-rpath,$ORIGIN:$ORIGIN/../lib/inkentry"
          # Native arm64 runner (free for public repos) + arm64 jammy
          # container. Replaces the old cross-compile + ports-mirror setup.
          # embed-llama without a GPU flavor = the llama.cpp CPU engine,
          # statically linked (no SDK, no extra files): where Vulkan can't go
          # (LunarG ships no arm64-linux SDK), llama.cpp CPU is still the
          # faster engine, with candle as the in-binary fallback.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: rich-formats,embed-llama
            container: ubuntu:22.04
          - os: macos-latest
            target: aarch64-apple-darwin
            features: rich-formats,metal
          # Pinned to windows-2022 (VS 2022): windows-latest now carries a
          # "Visual Studio 18 2026" preview whose MSBuild custom-build step breaks
          # ggml-vulkan's nested vulkan-shaders-gen ExternalProject. VS 2022 is
          # the toolchain llama.cpp ships Windows Vulkan on.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            features: rich-formats,llama-vulkan
            llama: true

    steps:
      # Inside the jammy container nothing is preinstalled. git must be
      # present before actions/checkout so it does a real clone; curl +
      # ca-certificates are for rustup; libdbus-1-dev + pkg-config are for the
      # keyring crate's sync-secret-service feature (links libdbus, a C lib);
      # cmake builds llama.cpp (jammy's 3.22 satisfies ggml's >= 3.19) and
      # libclang-dev feeds bindgen's FFI generation (both Linux legs carry a
      # llama engine feature; runner VMs have LLVM preinstalled, bare
      # containers have neither). Noninteractive: tzdata prompts otherwise.
      - name: Install build dependencies (Linux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config libdbus-1-dev \
            cmake libclang-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable (Linux container)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          # rustfmt: bindgen formats its generated FFI bindings with it and
          # prints a spurious "error:" line when it is missing.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The llama-vulkan feature needs the Vulkan SDK at BUILD time only:
      # glslc compiles the ggml shaders, the headers/loader are linked against.
      # Nothing Vulkan is a runtime requirement of the shipped binary — the
      # Vulkan backend is a dlopen'd module that fails to load (and degrades
      # to CPU) on machines without a driver. Pinned by version + sha256;
      # jammy's own vulkan packages are too old, hence the SDK tarball.
      - name: Install Vulkan SDK (Linux container)
        if: matrix.container != '' && matrix.llama
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # libvulkan-dev: the SDK tarball ships headers + glslc but no
          # prebuilt loader; linking needs only the loader's stable
          # entrypoints (ggml uses dynamic dispatch), so jammy's own loader
          # satisfies Vulkan_LIBRARY. Runtime uses the end user's system
          # loader regardless.
          apt-get install -y --no-install-recommends xz-utils libvulkan-dev
          # The SDK's glslc binary itself must RUN in this container: LunarG
          # builds it against glibc 2.34, inside the 2.35 floor. Check that
          # before any future SDK bump that outpaces the floor.
          SDK_VERSION="1.4.357.1"
          SDK_SHA256="4b41e3b30e8aedaa5dac7c136561ab463eb316a25a54e2c6245f2c299ea1fb85"
          curl -fsSL -o /tmp/vulkansdk.tar.xz \
            "https://sdk.lunarg.com/sdk/download/${SDK_VERSION}/linux/vulkansdk-linux-x86_64-${SDK_VERSION}.tar.xz"
          echo "${SDK_SHA256}  /tmp/vulkansdk.tar.xz" | sha256sum -c -
          mkdir -p /opt/vulkansdk
          tar -xf /tmp/vulkansdk.tar.xz -C /opt/vulkansdk
          rm /tmp/vulkansdk.tar.xz
          echo "VULKAN_SDK=/opt/vulkansdk/${SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          # find_package(SPIRV-Headers CONFIG) resolves via the SDK's
          # share/cmake, which only CMAKE_PREFIX_PATH makes visible.
          echo "CMAKE_PREFIX_PATH=/opt/vulkansdk/${SDK_VERSION}/x86_64" >> "$GITHUB_ENV"
          echo "/opt/vulkansdk/${SDK_VERSION}/x86_64/bin" >> "$GITHUB_PATH"

      # One command per step (Windows steps must not chain rustup invocations).
      - name: Install Rust toolchain (runner VM)
        if: matrix.container == ''
        run: rustup toolchain install stable --no-self-update

      # Same build-time-only Vulkan SDK as the Linux step above; the Qt
      # installer framework's silent mode needs the three flags exactly.
      # LunarG's Windows installer is vulkan-sdk.exe (not the Linux tarball's
      # name), and its latest 1.4.357 Windows build is .0 — the .1 respin is
      # Linux-only, so Windows pins its own version. curl.exe returning non-zero
      # does not stop pwsh on its own, so guard it explicitly: without the guard
      # a failed download surfaces only as a confusing Get-FileHash "path not
      # found" on the next line.
      - name: Download Vulkan SDK (Windows)
        if: matrix.llama && runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "1.4.357.0"
          $url = "https://sdk.lunarg.com/sdk/download/$v/windows/vulkan-sdk.exe"
          curl.exe -fsSL -o vulkansdk.exe $url
          if ($LASTEXITCODE -ne 0) { throw "vulkan-sdk.exe download failed (curl exit $LASTEXITCODE): $url" }
          $expected = "81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d"
          $actual = (Get-FileHash vulkansdk.exe -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "vulkansdk.exe sha256 mismatch: $actual" }

      - name: Install Vulkan SDK (Windows)
        if: matrix.llama && runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath .\vulkansdk.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install"
          $sdk = "C:\VulkanSDK\1.4.357.0"
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Vulkan SDK install did not produce $sdk\Bin\glslc.exe" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add Rust target (runner VM)
        if: matrix.container == ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The `${{ matrix.container }}` component keeps container-built artifacts
          # separate from caches produced by builds on the runner VM. cc-built
          # static archives (ring, bundled sqlite, blake3) do not refingerprint
          # on the C toolchain's glibc, so restoring a VM-era cache into the
          # container would silently re-raise the binaries' glibc ceiling.
          key: ${{ runner.os }}-${{ matrix.container }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.container }}-${{ matrix.target }}-

      - name: Build release binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Heal a wedged llama.cpp build dir out of the restored cache: the
          # sys crate skips cmake configure when its build dir exists, so a
          # dir cached after a failed configure (no Makefile) breaks every
          # later run at "gmake: Makefile: No such file or directory".
          # (Linux legs only: the Makefile marker is generator-specific.)
          if [ "${{ runner.os }}" = "Linux" ]; then
            for d in target/${{ matrix.target }}/release/build/llama-cpp-sys-2-*/out/build; do
              if [ -d "$d" ] && [ ! -f "$d/Makefile" ]; then
                rm -rf "$(dirname "$(dirname "$d")")"
              fi
            done
            # Drop llama libs hard-linked into the profile dirs by a previous
            # sys build (a restored cache): once their source build dir is
            # gone, the unversioned spellings in deps/ and examples/ dangle,
            # and the sys build script's re-link panics on AlreadyExists.
            # It recreates all of these whenever it runs; packaging reads
            # from out/backends, never from here.
            for d in "" deps/ examples/; do
              rm -f target/${{ matrix.target }}/release/${d}libggml*.so* \
                    target/${{ matrix.target }}/release/${d}libllama*.so*
            done
          fi
          # Single-quoted: $ORIGIN must reach the linker literally.
          if [ -n '${{ matrix.rustflags }}' ]; then
            export RUSTFLAGS='${{ matrix.rustflags }}'
          fi
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Windows Vulkan builds with the Visual Studio generator break on ggml's
      # nested vulkan-shaders-gen ExternalProject: its MSBuild custom-build step
      # fails the compiler probe ("batch label VCEnd" / C1083 empty file), on
      # both VS 2022 and the VS 2026 preview. Build with Ninja — the generator
      # llama.cpp uses on Windows, which runs the sub-build directly instead of
      # through the custom-build wrapper. Ninja needs the MSVC toolchain on PATH,
      # so source vcvars64 first; cmake-rs honors CMAKE_GENERATOR. The windows
      # legs carry no rustflags, so none are exported here.
      - name: Build release binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          CMAKE_GENERATOR: Ninja
          # ggml's nested vulkan-shaders-gen ExternalProject probe compiles with
          # /Zi, and its parallel C/CXX ABI checks share one vc140.pdb (fatal
          # error C1041). That nested probe never sees the outer build's /FS, so
          # inject it through cl.exe's own CL variable, which every cl.exe
          # invocation honors — including the sub-build's.
          CL: /FS
        run: |
          set "PF86=%ProgramFiles(x86)%"
          for /f "usebackq tokens=*" %%i in (`"%PF86%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH ( echo could not locate Visual Studio via vswhere & exit /b 1 )
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"

      # A dynamic-backends build splits the llama engine into the binary, four
      # core shared libs it links by SONAME, and dlopen'd ggml backend modules.
      # All of them ship next to the binaries; see the script for the layout.
      - name: Collect llama runtime libraries
        if: matrix.llama
        shell: bash
        run: |
          set -euo pipefail
          scripts/collect-ggml-backends.sh \
            "target/${{ matrix.target }}/release" \
            "target/${{ matrix.target }}/release"

      # The modules keep cmake's full symbol tables (cargo's `strip` profile
      # setting only reaches rust-linked artifacts); the Vulkan module alone
      # is ~50 MB unstripped.
      - name: Strip llama runtime libraries (Linux)
        if: matrix.llama && matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          strip --strip-unneeded target/${{ matrix.target }}/release/lib*.so*

      # The whole point of the container build: fail the release if either
      # binary needs a glibc symbol newer than the 2.35 floor. Pinned forever,
      # not measured once: must keep failing even after toolchain bumps. A
      # missing, empty, or non-numeric ceiling is treated as a broken check,
      # never as proof of compliance (a bare GLIBC_PRIVATE match, or no
      # GLIBC_ symbols at all, would otherwise slip through as a false pass).
      - name: Enforce glibc ceiling (Linux)
        if: matrix.container != ''
        shell: bash
        run: |
          set -euo pipefail
          shipped="inkentry inkentry-server"
          # The llama legs also ship shared objects; every ELF in the archive
          # must honor the same floor, or the engine silently dies on exactly
          # the distros the floor exists for.
          if [ -n "${{ matrix.llama }}" ]; then
            shipped="$shipped $(cd "target/${{ matrix.target }}/release" && ls lib*.so*)"
          fi
          for bin in $shipped; do
            path="target/${{ matrix.target }}/release/${bin}"
            raw="$(objdump -T "$path")"
            ceiling="$(printf '%s\n' "$raw" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1 || true)"
            if ! [[ "$ceiling" =~ ^GLIBC_[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${bin}: no valid versioned GLIBC symbol found (got '${ceiling}')"
              exit 1
            fi
            echo "${bin}: max versioned glibc symbol = ${ceiling}"
            max="$(printf '%s\nGLIBC_2.35\n' "$ceiling" | sort -V | tail -1)"
            if [ "$max" != "GLIBC_2.35" ]; then
              echo "::error::${bin} requires ${ceiling}, above the glibc 2.35 floor"
              exit 1
            fi
          done

      - name: Package tarball (unix)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="inkentry-${VERSION}-${TARGET}.tar.gz"
          # Flat archive; llama legs add the engine's shared libs and modules.
          extra=""
          if [ -n "${{ matrix.llama }}" ]; then
            extra="$(cd "target/${TARGET}/release" && ls lib*.so*)"
          fi
          # shellcheck disable=SC2086  # word-splitting $extra is the point
          tar -czf "${ARCHIVE}" \
            -C "target/${TARGET}/release" \
            inkentry inkentry-server ${extra}
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Package zip (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $VERSION  = "${{ github.ref_name }}"
          $TARGET   = "${{ matrix.target }}"
          $ARCHIVE  = "inkentry-${VERSION}-${TARGET}.zip"
          $binaries = @(
            "target\${TARGET}\release\inkentry.exe",
            "target\${TARGET}\release\inkentry-server.exe"
          )
          # llama leg: the engine's core DLLs + dlopen'd ggml backend modules.
          $libs = Get-ChildItem "target\${TARGET}\release" |
            Where-Object { $_.Name -match '^(ggml|llama).*\.dll$' } |
            ForEach-Object { $_.FullName }
          Compress-Archive -Path ($binaries + $libs) -DestinationPath $ARCHIVE
          "ARCHIVE=${ARCHIVE}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkentry-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Build Debian package (amd64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same as `build`: consumes and produces run artifacts only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inkentry-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: linux-amd64

      - name: Extract tarball
        run: |
          tar -xzf linux-amd64/inkentry-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz \
            -C linux-amd64

      # dpkg-shlibdeps can only map a linked library to its owning package if
      # that package is installed here, so the binaries' runtime libs must be
      # present on this runner even though nothing is compiled in this job.
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libdbus-1-3

      - name: Assemble deb layout
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for deb version field
          DEB_VERSION="${VERSION#v}"

          mkdir -p BUILD/DEBIAN
          mkdir -p BUILD/usr/bin
          mkdir -p BUILD/usr/lib/systemd/user
          mkdir -p BUILD/usr/lib/inkentry

          # Binaries
          install -m 755 linux-amd64/inkentry        BUILD/usr/bin/inkentry
          install -m 755 linux-amd64/inkentry-server BUILD/usr/bin/inkentry-server

          # llama engine: core shared libs (found via the binary's
          # $ORIGIN/../lib/inkentry rpath) and dlopen'd ggml backend modules
          # (found by the server probing the same directory).
          install -m 644 linux-amd64/lib*.so* BUILD/usr/lib/inkentry/

          # systemd user unit
          install -m 644 packaging/inkentry-server.service \
            BUILD/usr/lib/systemd/user/inkentry-server.service

          # Depends is derived from the packaged binaries, never hardcoded, and
          # derived INSIDE ubuntu:22.04 (the build floor), not on the ubuntu
          # runner: a newer userland resolves symbols against a newer libc and
          # derives a libc6 requirement the floor distros cannot install. The
          # container needs dpkg-dev plus every linked library's package
          # (libdbus-1-3); libc6/libgcc-s1 are in the base image.
          # dpkg-shlibdeps needs a debian/control in its working dir.
          DEB_DEPENDS="$(docker run --rm -v "$PWD:/w:ro" ubuntu:22.04 bash -c '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null
            apt-get install -y -qq --no-install-recommends dpkg-dev libdbus-1-3 >/dev/null
            mkdir -p /tmp/sd/debian
            printf "Source: inkentry\nMaintainer: inkentries <hello@inkentry.com>\n\nPackage: inkentry\nArchitecture: amd64\nDescription: placeholder\n placeholder\n" > /tmp/sd/debian/control
            cd /tmp/sd
            # -l resolves the private libggml/libllama libs the server links;
            # -e on the core libs folds their own needs (libstdc++6, libgcc)
            # into Depends. The ggml backend MODULES are deliberately absent:
            # they are dlopen-optional, and listing ggml-vulkan would turn
            # libvulkan1 into a hard dependency the CPU fallback does not have.
            dpkg-shlibdeps -O -l/w/BUILD/usr/lib/inkentry \
              -e/w/BUILD/usr/lib/inkentry/libggml-base.so.0 \
              -e/w/BUILD/usr/lib/inkentry/libggml.so.0 \
              -e/w/BUILD/usr/lib/inkentry/libllama.so.0 \
              -e/w/BUILD/usr/lib/inkentry/libllama-common.so.0 \
              /w/BUILD/usr/bin/inkentry /w/BUILD/usr/bin/inkentry-server
          ')"
          echo "Derived ${DEB_DEPENDS}"

          # DEBIAN/control — written via JS to avoid YAML heredoc issues
          DEB_DEPENDS="${DEB_DEPENDS}" \
          node .github/scripts/write-deb-control.js \
            --deb-version "${DEB_VERSION}" \
            --out BUILD/DEBIAN/control

          echo "DEB_VERSION=${DEB_VERSION}" >> "$GITHUB_ENV"

      - name: Build .deb
        run: |
          # -Zxz: a deterministic member format across every image the smoke
          # test installs on, independent of the runner dpkg's compressor
          # default.
          dpkg-deb --build -Zxz BUILD "inkentry_${{ env.DEB_VERSION }}_amd64.deb"

      # apt-get install SUCCEEDS on a .deb whose Depends omits a linked library;
      # only executing real subcommands (a git-backed memory round trip
      # included) surfaces that gap and proves the installed binary runs, not
      # just links. ubuntu:22.04 and debian:12 are the support floor (glibc
      # 2.35/2.36); ubuntu:24.04 guards the forward direction. The package is
      # mounted read-only; the scratch repo lives in the container's own
      # filesystem so the smoke test never writes into the runner's checkout.
      - name: Smoke-test the .deb in clean containers (floor and current)
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 debian:12 ubuntu:24.04; do
            echo "=== ${image} ==="
            docker run --rm -v "$PWD:/pkg:ro" -e INKENTRY_SECRET_STORE=file -e DEBIAN_FRONTEND=noninteractive "$image" bash -euc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkg/inkentry_${{ env.DEB_VERSION }}_amd64.deb
              apt-get install -y -qq --no-install-recommends git ca-certificates
              test -n "$(inkentry --version)"
              test -n "$(inkentry-server --version)"

              mkdir -p /w && cd /w
              git init -q .
              git config user.email t@t
              git config user.name t
              echo "fn main() {}" > main.rs
              git add . && git commit -qm init

              inkentry status
              inkentry init --no-index
              inkentry memory add --kind note --title "deb smoke" --body "runs on this image"
              inkentry memory list | grep -q "deb smoke"
            '
          done

      - name: Upload deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkentry-${{ github.ref_name }}-amd64-deb
          path: inkentry_${{ env.DEB_VERSION }}_amd64.deb

  # The .deb is only one packaging of the Linux binaries; the raw tarballs
  # (served by install.sh and the Homebrew formula) ship the same files and
  # must also be executed on the support floor. libdbus-1-3 is a declared
  # runtime dependency of the CLI (the .deb pulls it in via shlibdeps; tarball
  # users need it present, as on any desktop/server with dbus installed).
  tarball-smoke:
    name: Run tarball binaries on the support floor (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: inkentry-${{ github.ref_name }}-${{ matrix.target }}
          path: tarball

      - name: Extract tarball
        run: |
          tar -xzf tarball/inkentry-${{ github.ref_name }}-${{ matrix.target }}.tar.gz \
            -C tarball

      # Install-success proves nothing: apt is happy with a package whose
      # binary immediately fails to link or run. Exercise real subcommands
      # (a git-backed memory round trip included) on each floor/current image.
      - name: Execute on floor and current images
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 debian:12 ubuntu:24.04; do
            echo "=== ${image} ==="
            docker run --rm -v "$PWD/tarball:/t:ro" -e INKENTRY_SECRET_STORE=file -e DEBIAN_FRONTEND=noninteractive "$image" bash -euc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends libdbus-1-3 git ca-certificates
              test -n "$(/t/inkentry --version)"
              test -n "$(/t/inkentry-server --version)"

              mkdir -p /w && cd /w
              git init -q .
              git config user.email t@t
              git config user.name t
              echo "fn main() {}" > main.rs
              git add . && git commit -qm init

              /t/inkentry status
              /t/inkentry init --no-index
              /t/inkentry memory add --kind note --title "tarball smoke" --body "runs on this image"
              /t/inkentry memory list | grep -q "tarball smoke"
            '
          done

  release:
    name: Create GitHub Release
    needs: [build, deb, tarball-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Provenance attestation, below: `id-token` to mint the OIDC token the
      # signature is bound to, `attestations` to record the result against the
      # repository. Both are write-scoped by nature — there is no read form.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Published as a release asset so a packager, a mirror, or the install
      # script can check that what it received is what was uploaded. This
      # catches a truncated or tampered TRANSFER; it does not prove who built
      # the file, which is what the attestation below is for.
      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          set -euo pipefail
          # Bare filenames, no `./` prefix, so `sha256sum -c SHA256SUMS` works
          # from a directory holding only the one asset a user downloaded.
          sha256sum -- *.tar.gz *.zip *.deb | tee SHA256SUMS

      # Signs a statement binding each artifact's digest to this repository,
      # this workflow file, and this commit, and records it in the public
      # transparency log. Anyone can then check where a binary came from:
      #
      #   gh attestation verify inkentry-<tag>-<target>.tar.gz --repo inkentries/inkentry
      #
      # Unlike SHA256SUMS this is not self-referential: the signature is minted
      # from a short-lived OIDC token GitHub issues to this job, so it cannot be
      # regenerated by whoever managed to replace the assets.
      #
      # SHA256SUMS is deliberately not a subject. It is a manifest OF the
      # subjects, and attesting it would only assert that a file listing
      # digests exists.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -qE '\-(rc|beta|alpha)'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE \
            artifacts/*.tar.gz \
            artifacts/*.zip \
            artifacts/*.deb \
            artifacts/SHA256SUMS

  update-homebrew-formula:
    name: Update Homebrew tap (inkentries/homebrew-inkentry)
    needs: release
    # Stable tags always publish; pre-release tags publish only on the v1.0.0
    # line, so the release candidates are installable via brew before v1 ships.
    # The condition expires itself: once v1.0.0 is out, a v1.1.0-rc tag no
    # longer matches and cannot serve an rc to users tracking stable.
    if: ${{ !contains(github.ref_name, '-') || startsWith(github.ref_name, 'v1.0.0-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read sha256 digests from the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for formula version field
          VER="${VERSION#v}"

          release_digest() {
            local target="$1"
            local asset="inkentry-${VERSION}-${target}.tar.gz"
            # Each release asset carries a `digest` field shaped "sha256:<hex>" —
            # no need to download the tarball and hash it ourselves.
            gh release view "${VERSION}" --json assets \
              --jq ".assets[] | select(.name == \"${asset}\") | .digest" \
              | sed 's/^sha256://'
          }

          SHA_AARCH64_DARWIN="$(release_digest aarch64-apple-darwin)"
          SHA_AARCH64_LINUX="$(release_digest aarch64-unknown-linux-gnu)"
          SHA_X86_64_LINUX="$(release_digest x86_64-unknown-linux-gnu)"

          echo "SHA_AARCH64_DARWIN=${SHA_AARCH64_DARWIN}" >> "$GITHUB_ENV"
          echo "SHA_AARCH64_LINUX=${SHA_AARCH64_LINUX}"   >> "$GITHUB_ENV"
          echo "SHA_X86_64_LINUX=${SHA_X86_64_LINUX}"     >> "$GITHUB_ENV"
          echo "VER=${VER}"                                >> "$GITHUB_ENV"

      # Pointing this back at the old organisation's tap is not a fix for a
      # checkout failure — that tap serves the pre-rename binary names and would
      # publish this repo's checksums under URLs it does not own.
      - name: Checkout homebrew-inkentry tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inkentries/homebrew-inkentry
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Regenerate Formula/inkentry.rb
        run: |
          node .github/scripts/update-homebrew-formula.js \
            --version "$VER" \
            --sha-aarch64-darwin "$SHA_AARCH64_DARWIN" \
            --sha-aarch64-linux "$SHA_AARCH64_LINUX" \
            --sha-x86_64-linux "$SHA_X86_64_LINUX" \
            --out tap/Formula/inkentry.rb

          cat tap/Formula/inkentry.rb

      - name: Commit and push to homebrew-inkentry
        working-directory: tap
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Staged, not worktree, comparison: the first release into an empty
          # tap writes a file git has never tracked, and `git diff` reports no
          # change for one of those — which would silently skip the push that
          # creates the formula.
          git add Formula/inkentry.rb
          if git diff --cached --quiet -- Formula/inkentry.rb; then
            echo "No changes to Formula/inkentry.rb — skipping push."
            exit 0
          fi

          git commit -m "inkentry ${{ github.ref_name }}"
          git push origin main

  update-scoop-manifest:
    name: Update Scoop bucket (inkentries/scoop-inkentry)
    needs: release
    # Same gate as update-homebrew-formula: stable always, pre-releases only on
    # the v1.0.0 line.
    if: ${{ !contains(github.ref_name, '-') || startsWith(github.ref_name, 'v1.0.0-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Windows sha256 digest from the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VER="${VERSION#v}"
          ASSET="inkentry-${VERSION}-x86_64-pc-windows-msvc.zip"
          # The release asset's `digest` field is "sha256:<hex>".
          SHA_X86_64_WINDOWS="$(gh release view "${VERSION}" --json assets \
            --jq ".assets[] | select(.name == \"${ASSET}\") | .digest" \
            | sed 's/^sha256://')"
          echo "SHA_X86_64_WINDOWS=${SHA_X86_64_WINDOWS}" >> "$GITHUB_ENV"
          echo "VER=${VER}"                               >> "$GITHUB_ENV"

      - name: Checkout scoop-inkentry bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: inkentries/scoop-inkentry
          path: bucket-repo
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Regenerate bucket/inkentry.json
        run: |
          node .github/scripts/update-scoop-manifest.js \
            --version "$VER" \
            --sha-x86_64-windows "$SHA_X86_64_WINDOWS" \
            --out bucket-repo/bucket/inkentry.json

          cat bucket-repo/bucket/inkentry.json

      - name: Commit and push to the bucket
        working-directory: bucket-repo
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/inkentry.json

          if git diff --cached --quiet -- bucket/inkentry.json; then
            echo "No changes to bucket/inkentry.json — skipping push."
            exit 0
          fi

          git commit -m "scoop: inkentry ${{ github.ref_name }}"
          git push origin main
