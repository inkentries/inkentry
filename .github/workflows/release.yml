name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            features: ""
            suffix: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            features: ""
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            features: ""
            suffix: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
            features: rich-formats
            suffix: -rich-formats
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
            features: rich-formats
            suffix: -rich-formats
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
            features: rich-formats
            suffix: -rich-formats

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Install cross (Linux aarch64 only)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build release binaries (native)
        if: "!matrix.cross"
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cargo build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Build release binaries (cross)
        if: matrix.cross
        run: |
          FEATURES="${{ matrix.features }}"
          if [ -n "$FEATURES" ]; then
            cross build --release --target ${{ matrix.target }} --features "$FEATURES"
          else
            cross build --release --target ${{ matrix.target }}
          fi

      - name: Strip binaries (native Linux/macOS x86_64)
        if: "!matrix.cross && matrix.target != 'aarch64-apple-darwin'"
        run: |
          strip target/${{ matrix.target }}/release/spelunk
          strip target/${{ matrix.target }}/release/spelunk-server

      - name: Package tarball
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE="spelunk-${VERSION}-${TARGET}${{ matrix.suffix }}.tar.gz"
          tar -czf "${ARCHIVE}" \
            -C "target/${TARGET}/release" \
            spelunk spelunk-server
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: spelunk-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.suffix }}
          path: ${{ env.ARCHIVE }}

  deb:
    name: Build Debian package (amd64)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download x86_64 Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: spelunk-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          path: linux-amd64

      - name: Extract tarball
        run: |
          tar -xzf linux-amd64/spelunk-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz \
            -C linux-amd64

      - name: Assemble deb layout
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for deb version field
          DEB_VERSION="${VERSION#v}"

          mkdir -p BUILD/DEBIAN
          mkdir -p BUILD/usr/bin
          mkdir -p BUILD/usr/lib/systemd/user

          # Binaries
          install -m 755 linux-amd64/spelunk        BUILD/usr/bin/spelunk
          install -m 755 linux-amd64/spelunk-server BUILD/usr/bin/spelunk-server

          # systemd user unit
          install -m 644 packaging/spelunk-server.service \
            BUILD/usr/lib/systemd/user/spelunk-server.service

          # DEBIAN/control — written via JS to avoid YAML heredoc issues
          node .github/scripts/write-deb-control.js \
            --deb-version "${DEB_VERSION}" \
            --out BUILD/DEBIAN/control

          echo "DEB_VERSION=${DEB_VERSION}" >> "$GITHUB_ENV"

      - name: Build .deb
        run: |
          dpkg-deb --build BUILD "spelunk_${{ env.DEB_VERSION }}_amd64.deb"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: spelunk-${{ github.ref_name }}-amd64-deb
          path: spelunk_${{ env.DEB_VERSION }}_amd64.deb

  release:
    name: Create GitHub Release
    needs: [build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if echo "${{ github.ref_name }}" | grep -qE '\-(rc|beta|alpha)'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE \
            artifacts/*.tar.gz \
            artifacts/*.deb

  update-homebrew-formula:
    name: Update HomebrewFormula/spelunk.rb
    needs: release
    # Skip pre-release tags (rc/beta/alpha) — formula only tracks stable releases.
    if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') && !contains(github.ref_name, '-alpha') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Read sha256 digests from the GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' for formula version field
          VER="${VERSION#v}"

          release_digest() {
            local target="$1"
            local asset="spelunk-${VERSION}-${target}.tar.gz"
            # Each release asset carries a `digest` field shaped "sha256:<hex>" —
            # no need to download the tarball and hash it ourselves.
            gh release view "${VERSION}" --json assets \
              --jq ".assets[] | select(.name == \"${asset}\") | .digest" \
              | sed 's/^sha256://'
          }

          SHA_AARCH64_DARWIN="$(release_digest aarch64-apple-darwin)"
          SHA_AARCH64_LINUX="$(release_digest aarch64-unknown-linux-gnu)"
          SHA_X86_64_LINUX="$(release_digest x86_64-unknown-linux-gnu)"

          echo "SHA_AARCH64_DARWIN=${SHA_AARCH64_DARWIN}" >> "$GITHUB_ENV"
          echo "SHA_AARCH64_LINUX=${SHA_AARCH64_LINUX}"   >> "$GITHUB_ENV"
          echo "SHA_X86_64_LINUX=${SHA_X86_64_LINUX}"     >> "$GITHUB_ENV"
          echo "VER=${VER}"                                >> "$GITHUB_ENV"

      - name: Regenerate HomebrewFormula/spelunk.rb
        run: |
          node .github/scripts/update-homebrew-formula.js \
            --version "$VER" \
            --sha-aarch64-darwin "$SHA_AARCH64_DARWIN" \
            --sha-aarch64-linux "$SHA_AARCH64_LINUX" \
            --sha-x86_64-linux "$SHA_X86_64_LINUX" \
            --out HomebrewFormula/spelunk.rb

          cat HomebrewFormula/spelunk.rb

      - name: Open PR with the updated formula
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- HomebrewFormula/spelunk.rb; then
            echo "No changes to HomebrewFormula/spelunk.rb — skipping PR."
            exit 0
          fi

          BRANCH="chore/homebrew-formula-v${VER}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add HomebrewFormula/spelunk.rb
          git commit -m "chore: update Homebrew formula to v${VER}"
          # `main` is branch-protected — push the change on its own branch and
          # open a PR rather than pushing directly.
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: update Homebrew formula to v${VER}" \
            --body "Automated update of \`HomebrewFormula/spelunk.rb\` for release \`${{ github.ref_name }}\`, generated by \`.github/scripts/update-homebrew-formula.js\` from the release asset sha256 digests."
