name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  # Force the file-backed secret store in all CI runs. The OS keychain
  # (macOS Keychain / Linux Secret Service) is not available in headless
  # runners: on Linux, libdbus-sys is present but the Secret Service daemon
  # isn't running; on macOS, Keychain.app prompts for authorisation and
  # blocks indefinitely. The file store is the correct CI fallback and is
  # explicitly tested as a first-class path in spelunk-core's secret_store
  # tests. Integration tests (backend_kind_diagnostic) inherit this env var
  # automatically via the cargo test subprocess.
  SPELUNK_SECRET_STORE: file

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy (rich-formats)
        run: cargo clippy --all-targets --features rich-formats -- -D warnings

      - name: Check (rich-formats)
        run: cargo check --all-targets --features rich-formats

      - name: Build (rich-formats)
        run: cargo build --all-targets --features rich-formats

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Linux links the native embedder (ort/fastembed) so the
            # `embed-native` path stays under test on at least one platform.
            test-flags: ""
          - os: macos-latest
            # macOS drops `embed-native`: ort's build script bakes absolute
            # `-lclang_rt.osx` / ONNX-download-cache link paths that don't
            # survive a restored `target/` cache or a runner-image rotation,
            # producing `ld: library 'clang_rt.osx' not found`. The embedder is
            # EXPERIMENTAL / NOT RECOMMENDED and is covered on the Linux leg.
            test-flags: "--no-default-features"
          - os: windows-latest
            # Windows keeps default features: the embed-native default uses the
            # ORT CPU execution provider (no Metal/DirectML), which links cleanly.
            # The spelunk-server tests use embedder: None and never load the model.
            test-flags: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `-v2` bump abandons the poisoned pre-2026-06-24 macOS caches that
          # held stale ort link directives. Keep restore-keys on the same
          # `-v2-` prefix so we never fall back into a poisoned cache.
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Install ast-grep
        run: npm install --global @ast-grep/cli

      - name: Run tests
        run: cargo test --verbose ${{ matrix.test-flags }}

  openapi-snapshot:
    name: OpenAPI snapshot check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Generate OpenAPI spec
        run: cargo run -p spelunk-server -- --print-openapi > /tmp/openapi-generated.json

      - name: Diff against committed snapshot
        run: |
          if ! diff -w -u docs/openapi.json /tmp/openapi-generated.json; then
            echo ""
            echo "ERROR: docs/openapi.json is out of date."
            echo "Run: cargo run -p spelunk-server -- --print-openapi > docs/openapi.json"
            echo "Then commit the updated snapshot."
            exit 1
          fi
