name: CI

on:
  push:
    branches: ["main"]
  # No base-branch filter. A pull request stacked on another PR's branch has a
  # base that is not `main`, and a `branches:` filter here would give it no CI
  # at all — the dangerous shape, since the PR still looks mergeable. The
  # `push` trigger above stays pinned to `main`: it guards the merged trunk,
  # and broadening it would run the whole suite on every branch push.
  pull_request:

# Deny by default; every job below grants only what it needs. None of these
# jobs push commits, comment on PRs, or create releases, so `contents: read`
# (checkout only) covers all of them.
permissions: {}

# Every `uses:` below is pinned to a commit SHA rather than a tag, here and in
# every other workflow in this repo. A tag is a mutable pointer: whoever
# controls the action's repository can move `v2` onto a different commit, and
# every run picks it up with no diff to review — including jobs holding a token
# or a release credential. The trailing comment names the release the SHA came
# from, and Dependabot bumps the SHA and that comment together.

env:
  CARGO_TERM_COLOR: always
  # Force the file-backed secret store in all CI runs. The OS keychain
  # (macOS Keychain / Linux Secret Service) is not available in headless
  # runners: on Linux, libdbus-sys is present but the Secret Service daemon
  # isn't running; on macOS, Keychain.app prompts for authorisation and
  # blocks indefinitely. The file store is the correct CI fallback and is
  # explicitly tested as a first-class path in inkentry-core's secret_store
  # tests. Integration tests (backend_kind_diagnostic) inherit this env var
  # automatically via the cargo test subprocess.
  INKENTRY_SECRET_STORE: file

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      # clippy/check/build in this job need no debug info from the dev
      # profile; the full workspace build (rich-formats, incl. the embedder
      # dep tree) has been observed to exhaust runner disk (ENOSPC) with debug
      # info on. Mirrors CARGO_PROFILE_TEST_DEBUG below.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git isolation lint
        run: scripts/check-git-isolation.sh

      - name: Disk usage (baseline)
        run: df -h

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      # Swatinem/rust-cache prunes stale/unused build artifacts, incremental
      # output, and anything older than a week before saving, so it can't
      # accumulate the way a hand-rolled `restore-keys`-prefix cache does (that
      # required a manual version-prefix bump to reset once it got poisoned;
      # see the `test` job below for that history).
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Disk usage (after cache restore)
        run: df -h

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # --lib --bins --tests --benches (not --all-targets): examples are never
      # part of the regular build/lint/test gates. Several examples
      # (chunk_quality_eval, embed_bench) directly depend on the native
      # embedder and are meant to be run explicitly with the right features,
      # not swept in by a workspace-wide command that doesn't grant them.
      - name: Clippy (rich-formats)
        run: cargo clippy --lib --bins --tests --benches --features rich-formats -- -D warnings

      - name: Check (rich-formats)
        run: cargo check --lib --bins --tests --benches --features rich-formats

      - name: Build (rich-formats)
        run: cargo build --lib --bins --tests --benches --features rich-formats

      - name: Disk usage (after build)
        if: always()
        run: df -h

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Windows gets 60, everything else 30, and the extra half hour is
    # diagnostic rather than generous. That leg was switched off because it
    # would run for around half an hour and then die with no consistent failing
    # test to point at — which is what being killed AT a ceiling looks like, not
    # what a failing test looks like. Measured wall-clock on two instrumented
    # attempts was 937s and 1258s, outside the 19-run baseline range, so a whole
    # run is sometimes uniformly ~1.6x slower there for reasons still
    # unexplained (the Defender-exclusion hypothesis was tested and disproved).
    # At 30 those runs are indistinguishable from a hang. At 60 a slow run
    # finishes and says what it found, and anything still hitting the ceiling is
    # a real hang worth chasing. Lower it once the slowdown is explained; the
    # observed range since the leg came back is 9 to 21 minutes.
    #
    # Expressed over `matrix.os` rather than as a matrix key, because a matrix
    # key becomes part of the job name and would rename every existing check.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    env:
      # Test binaries don't need full debug info; this shrinks compile times
      # and cache size for this job without affecting check/build.
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # Default features: builds the native embedder (candle F2LLM) so
            # the `embed-native` path stays under test.
            test-flags: ""
          - os: ubuntu-latest
            # Drops the server's `embed-native` feature: this builds the
            # external-endpoint-only server (no hf-hub download path, no candle
            # in inkentry-server) and keeps that shipped configuration under
            # test. Note candle is an unconditional dep of the inkentry-embed
            # crate, so its native embedder still compiles here as a workspace
            # member. The embedder is EXPERIMENTAL / NOT RECOMMENDED.
            #
            # This leg used to run on macOS. Nothing about the feature
            # combination is platform-specific, so it moved to Linux where the
            # rest of the matrix already runs; the macOS entry below
            # deliberately does not carry it, to avoid a duplicate.
            test-flags: "--no-default-features"
          - os: macos-latest
            test-flags: ""
          - os: windows-latest
            # Windows keeps default features: the embed-native default builds
            # the candle (CPU) embedder, which links cleanly. The
            # inkentry-server tests use embedder: None and never load the model.
            test-flags: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libdbus (keyring sync-secret-service backend, Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      # One command per step: this job's matrix covers windows-latest, and a
      # Windows step's exit status does not reflect a failing native executable
      # (only a failing PowerShell cmdlet), so chaining two rustup invocations
      # in one run block would mask a failure in the first.
      - name: Update stable toolchain
        run: rustup update stable

      - name: Set default toolchain
        run: rustup default stable

      # Previously a hand-rolled `actions/cache` keyed by `${{ runner.os }}-cargo-vN-<lockfile-hash>`
      # with a prefix `restore-keys` fallback. That fallback matches on prefix
      # only, so every run kept rehydrating whatever `target/` a past run left
      # behind and layering new output on top of it — cargo has no built-in GC
      # for artifacts of a dependency edge (or, as of the test-binary
      # consolidation, a renamed/merged test binary) that no longer exists.
      # This bit twice (the `-v1` -> `-v2` bump abandoned poisoned macOS
      # native-embedder caches; `-v2` -> `-v3` abandoned stale candle/
      # candle-transformers artifacts from before inkentry-cli's embedder dep
      # was dropped), each time requiring a human to notice the bloat and
      # manually reset the prefix. Swatinem/rust-cache replaces that: it
      # prunes unused dependencies, incremental artifacts, and anything with
      # an mtime older than a week before every save, so the cache can't
      # accumulate garbage between resets in the first place.
      #
      # The `key` differentiates the two `ubuntu-latest` matrix legs (default
      # vs `--no-default-features`), which otherwise share the same OS/rustc
      # host and would collide on the action's automatic job-based key.
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.test-flags }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest

      # --lib --bins --tests --benches (not the nextest default, which also
      # builds examples): examples are never part of the regular test gate,
      # see the Check & Lint job's Clippy step comment above.
      #
      # --no-fail-fast: nextest otherwise cancels the run on the first failure,
      # so a single failing test hides the state of every test ordered after it
      # and each fix costs another full push-and-wait to learn what else is
      # broken. The matrix already sets `fail-fast: false` for the same reason
      # one leg shouldn't cancel the others. A red run now costs a full suite
      # duration, which the 30-minute job timeout has to cover.
      - name: Run tests
        run: cargo nextest run --no-fail-fast --lib --bins --tests --benches ${{ matrix.test-flags }}

      - name: Run doctests
        run: cargo test --doc ${{ matrix.test-flags }}

  clippy-native:
    name: Clippy (native)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    env:
      # This job only lints (no debug binary is ever run), so the dev
      # profile's debug info buys nothing; mirrors Check & Lint's env var.
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A standalone job, not folded into the `test` job's matrix: `test`
      # builds the `test` cargo profile (for nextest) while clippy here builds
      # the `dev` profile, and the two don't share incremental artifacts. A
      # combined job pays for both builds back-to-back on the same runner
      # (measured +~7 min on Windows); a separate job runs them concurrently
      # instead. Public-repo Actions minutes are free, so total runner-minutes
      # spent isn't the tradeoff here — PR wall-clock latency is.
      #
      # One command per step: this job's matrix covers windows-latest, and a
      # Windows step's exit status does not reflect a failing native
      # executable (only a failing PowerShell cmdlet), so chaining rustup
      # invocations in one run block would mask a failure in the first.
      - name: Update stable toolchain
        run: rustup update stable

      - name: Set default toolchain
        run: rustup default stable

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Windows/macOS only: the Check & Lint job already runs this on Linux,
      # but a Linux-only pass can't see #[cfg(windows)] or #[cfg(unix)]-gated
      # code paths that don't compile on Linux at all (see #95, a
      # Windows-only dead-code warning clippy on Linux had no way to catch).
      #
      # --lib --bins --tests --benches (not --all-targets): examples are
      # never part of the regular build/lint/test gates, see Check & Lint's
      # Clippy step comment.
      - name: Clippy (rich-formats)
        run: cargo clippy --lib --bins --tests --benches --features rich-formats -- -D warnings

  release-scripts:
    name: Release script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The packaging scripts only otherwise run at release-tag time, where a
      # break is expensive. node:test is a builtin: nothing to install.
      - name: Test packaging scripts
        run: |
          node --test \
            .github/scripts/write-deb-control.test.js \
            .github/scripts/version-order.test.js

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The image compiles the release server (candle embedder) from scratch with
    # no cargo cache, so allow a generous ceiling.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -t inkentry-server:ci .

      # Assert the image ships the REAL server, not a placeholder: a no-op
      # binary exits 0 on every flag, so check for actual OUTPUT. Running the
      # binary also resolves every NEEDED shared lib at load, guarding the
      # runtime stage's lib set (a `docker build` alone never runs it).
      - name: Smoke-test the image
        run: |
          test -n "$(docker run --rm inkentry-server:ci --version)"
          docker run --rm inkentry-server:ci --print-openapi | head -c1 | grep -q .

      # Regression check for the container-user-has-no-home bug: start the
      # image against a real named volume (as a deployment would) and poll
      # `/v1/health` from a sidecar sharing its network namespace (the
      # pattern documented at the top of the Dockerfile, since the server
      # only binds loopback). This only needs the embedder's model-cache
      # `mkdir` to succeed, not the full ~339 MB download: `create_dir_all`
      # runs before any network I/O in `load_from_hub()`, so a cache-dir
      # failure surfaces as an `unavailable` state within a couple of
      # seconds, well before "loading" would ever complete.
      - name: Check embedder initializes against the persistent volume
        run: |
          docker run -d --name inkentry-server-ci -v inkentry-data-ci:/data inkentry-server:ci
          trap 'docker logs inkentry-server-ci || true; docker rm -f inkentry-server-ci >/dev/null 2>&1; docker volume rm inkentry-data-ci >/dev/null 2>&1' EXIT

          health=""
          for _ in $(seq 1 30); do
            health="$(docker run --rm --network container:inkentry-server-ci curlimages/curl -s http://127.0.0.1:4655/v1/health || true)"
            [ -n "$health" ] && break
            sleep 1
          done

          if [ -z "$health" ]; then
            echo "ERROR: /v1/health never answered"
            exit 1
          fi
          echo "$health"

          state="$(echo "$health" | jq -r '.embedder.state')"
          detail_lower="$(echo "$health" | jq -r '.embedder.detail // empty' | tr '[:upper:]' '[:lower:]')"

          if [ "$state" = "unavailable" ]; then
            case "$detail_lower" in
              *mkdir*|*"permission denied"*)
                echo "ERROR: embedder failed to initialize (model-cache dir/permissions failure): $detail_lower"
                exit 1
                ;;
            esac
          fi

  openapi-snapshot:
    name: OpenAPI snapshot check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Generate OpenAPI spec
        run: cargo run -p inkentry-server -- --print-openapi > /tmp/openapi-generated.json

      - name: Diff against committed snapshot
        run: |
          if ! diff -w -u docs/openapi.json /tmp/openapi-generated.json; then
            echo ""
            echo "ERROR: docs/openapi.json is out of date."
            echo "Run: cargo run -p inkentry-server -- --print-openapi > docs/openapi.json"
            echo "Then commit the updated snapshot."
            exit 1
          fi
