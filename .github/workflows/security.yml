name: Security

on:
  push:
    branches: [main]
  # No base-branch filter, so a PR stacked on another PR's branch is audited
  # too. See the longer note in ci.yml.
  pull_request:
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch newly-disclosed advisories.
    - cron: "0 8 * * 1"

# Deny by default; both jobs below only check out the repo and run a
# read-only audit/deny tool, so `contents: read` covers them.
permissions: {}

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: |
          rustup update stable
          rustup default stable

      # This job never builds the workspace (cargo-audit only reads Cargo.lock
      # against the advisory DB), so there's nothing to cache here beyond the
      # tool itself. install-action fetches a prebuilt binary instead of
      # compiling one, which is both faster and needs no cache to stay fast.
      - name: Install cargo-audit
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: |
          rustup update stable
          rustup default stable

      # Same reasoning as cargo-audit above: this job never builds the
      # workspace, so a prebuilt binary from install-action replaces both the
      # cache and the from-source `cargo install`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories licenses bans
