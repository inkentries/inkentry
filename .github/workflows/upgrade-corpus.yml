name: Upgrade corpus

# Open every artifact in the checked-in upgrade corpus with the current build
# and assert nothing is lost. The corpus is real output from released binaries,
# so this is the only job that tests against what users actually have rather
# than against an old shape rebuilt by hand.
#
# It also guards the corpus being empty of databases on purpose. That is the
# state a corpus which quietly stopped collecting also has, and
# `a_schema_version_that_advances_past_the_corpus_fails_here` is what tells the
# two apart — so this job has to keep running while there is nothing to open.

on:
  push:
    branches:
      - "main"
      - "release/**"
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - "crates/inkentry-cli/tests/upgrade_corpus.rs"
      - "crates/inkentry-cli/tests/fixtures/upgrade-corpus/**"
      - "crates/inkentry-core/src/storage/**"
      - "crates/inkentry-core/migrations/**"
      - "scripts/upgrade-corpus/**"
      - ".github/workflows/upgrade-corpus.yml"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # The OS keychain is unavailable in headless runners and blocks indefinitely
  # on macOS.
  INKENTRY_SECRET_STORE: file

jobs:
  corpus:
    name: Upgrade corpus
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7

      - name: Install libdbus (keyring sync-secret-service backend)
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install stable toolchain
        run: |
          rustup update stable
          rustup default stable

      # See ci.yml's `test` job for why this is Swatinem/rust-cache rather
      # than a hand-rolled `actions/cache` with a version-prefixed key.
      - name: Cache
        uses: Swatinem/rust-cache@v2

      # Reads the checked-in fixtures only. No release download, no server, no
      # model: the corpus is self-contained so this leg cannot be broken by a
      # network hiccup.
      - name: Upgrade every wing and assert integrity
        run: cargo test -p inkentry-cli --test upgrade_corpus
