version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gix:
        patterns:
          - "gix"
          - "gix-*"
      ast-grep:
        patterns:
          - "ast-grep-*"
      # llama-cpp-2 and llama-cpp-sys-2 are a pinned pair (both `=` in the
      # workspace manifest) that breaks across releases if their versions
      # diverge, so they must always bump together in one PR. See the pin
      # comment in Cargo.toml.
      llama-cpp:
        patterns:
          - "llama-cpp-2"
          - "llama-cpp-sys-2"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Dev-only (Dockerfile + docker-compose*.yml); manual bumps are easy to forget,
  # so let Dependabot keep the base image current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
