[package]
name = "spelunk-server"
version = "0.8.2"
edition = "2024"
description = "spelunk shared memory server"
license = "MIT"
repository = "https://github.com/spelunk-cloud/spelunk"

[[bin]]
name = "spelunk-server"
path = "src/main.rs"

[lib]
name = "spelunk_server"
path = "src/lib.rs"

[features]
default = ["embed-native"]
embed-native = ["dep:fastembed", "dep:ort"]
# Hardware-accelerated execution providers — enable the one that matches the
# build target. Without any of these the native embedder falls back to the
# default ORT CPU EP (functional, recommended).
#
# EXPERIMENTAL / NOT RECOMMENDED: fastembed tokenizes with
# `PaddingStrategy::BatchLongest` (vendor/fastembed/src/common.rs), so every
# batch has a different (batch_size, seq_len) shape. Hardware EPs compile a
# specialized graph per shape they see, so a constantly-varying shape causes
# the EP to recompile on (almost) every batch instead of running inference.
# Observed with embed-coreml: 9-12 GB oscillating memory, <25% CPU / <1% GPU
# utilization (stuck compiling, not computing), and request timeouts on the
# very first batch. Fixing this properly requires patching fastembed to use
# fixed-length padding, which is out of scope here. Until that lands, leave
# these features disabled.
embed-coreml   = ["embed-native", "fastembed/coreml",   "ort/coreml"]   # macOS
embed-xnnpack  = ["embed-native", "fastembed/xnnpack",  "ort/xnnpack"]  # Linux
embed-directml = ["embed-native", "fastembed/directml", "ort/directml"] # Windows

[dependencies]
spelunk-core = { path = "../spelunk-core" }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
reqwest = { workspace = true }
openssl = { workspace = true }
openssl-sys = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["auth"] }
async-stream = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive", "env"] }
regex = { version = "1", default-features = false, features = ["std"] }
dirs = "6"
fastembed = { version = "5", optional = true }
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tower = { version = "0.5", features = ["util"] }
utoipa = { version = "5", features = ["axum_extras"] }
