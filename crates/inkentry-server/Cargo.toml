[package]
name = "inkentry-server"
version = "1.0.2"
edition = "2024"
description = "inkentry shared memory server"
license = "MIT"
repository = "https://github.com/inkentries/inkentry"

[[bin]]
name = "inkentry-server"
path = "src/main.rs"

[lib]
name = "inkentry_server"
path = "src/lib.rs"

[features]
default = ["embed-llama"]
# embed-llama: bundle the F2LLM-v2-330M embedder (llama.cpp engine) and its
# Hugging Face Hub acquisition path (`embed_hub` module) that resolves the
# canonical llama.cpp GGUF before handing it to `inkentry-embed`. Enables the
# optional `inkentry-embed` dep. The bare feature builds the CPU engine; add one
# of the GPU flavors below for hardware acceleration. Disable this feature for an
# external-endpoint-only server with no bundled embedder.
embed-llama = ["dep:inkentry-embed", "inkentry-embed/llama", "dep:hf-hub", "dep:dirs", "dep:same-file"]
# llama-metal: llama.cpp Metal GPU — the macOS release target.
llama-metal = ["embed-llama", "inkentry-embed/llama-metal"]
# llama-vulkan: llama.cpp Vulkan GPU + runtime-loaded backend modules — the
# cross-vendor Windows/Linux release target.
llama-vulkan = ["embed-llama", "inkentry-embed/llama-vulkan"]

[dependencies]
inkentry-core = { path = "../inkentry-core" }
inkentry-embed = { path = "../inkentry-embed", optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
axum = { version = "0.8", features = ["macros"] }
axum-server = { workspace = true }
# In-process TLS (ADR-066): needed only to install the `ring` CryptoProvider as
# the process default at startup.
rustls = { workspace = true }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["auth", "timeout", "limit"] }
async-stream = "0.3"
tokio-stream = "0.1"
futures-util = "0.3"
utoipa = { version = "5", features = ["axum_extras"] }
clap = { version = "4", features = ["derive", "env"] }
regex = { version = "1", default-features = false, features = ["std"] }
blake3 = "1"
constant_time_eq = "0.6"
# Physical core count for the embed CPU-thread budget (main.rs). Not gated by
# embed-llama: the budget is resolved before the runtime starts regardless of
# feature set. Pinned here since no other crate uses it directly.
num_cpus = "1"
# Available system memory for the reserved interactive embed lane's capacity
# gate (main.rs, ADR-096 §4). `system` is the only feature needed; the rest of
# sysinfo (disks, networks, components) stays out. Pinned here since no other
# crate uses it.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Hugging Face Hub acquisition path for the bundled embedder (`embed_hub`
# module) — the only place in the workspace that depends on `hf-hub`. Gated
# behind `embed-llama` so a build without that feature carries none of this.
# Pinned directly here (not in [workspace.dependencies]) since no other crate
# uses it.
hf-hub = { version = "0.5", default-features = false, features = ["tokio", "ureq", "rustls-tls"], optional = true }
dirs = { workspace = true, optional = true }
# Decides whether two paths name one file, which std exposes on Unix
# (`dev`/`ino`) but not on stable Windows. The model loader needs it to avoid
# copying the cached model onto itself. Already in the tree via `walkdir`.
same-file = { version = "1", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
utoipa = { version = "5", features = ["axum_extras"] }
