[package]
name = "inkentry-core"
version = "1.0.2"
edition = "2024"
description = "Core library for inkentry — storage, indexer, search, embeddings"
license = "MIT"
repository = "https://github.com/inkentries/inkentry"

[features]
default = []
rich-formats = ["dep:lopdf", "dep:docx-rs", "dep:calamine"]
# Exposes in-memory test doubles (e.g. `config::secret_store::MemoryStore`) to
# downstream crates' tests without pulling them into release builds.
test-support = []
# Dev-only, for the chunk_quality_eval example alone (see its `required-features`
# below): turns inkentry-embed's default-off `native` back on so the example can
# construct a NativeEmbedder in-process. Nothing shipped may enable it — the
# whole point of core's `default-features = false` on inkentry-embed is that
# inkentry-cli, which only reaches inference over HTTP, doesn't statically link
# candle. Feature unification means a workspace-wide `--all-features` would drag
# candle into the CLI build through this; CI doesn't use it, and deny.toml
# pins `all-features = false`.
native-embed = ["inkentry-embed/native"]

[dependencies]
# Trait-only dep (no candle): owns EmbeddingBackend, re-exported below. Storage-free.
inkentry-embed = { path = "../inkentry-embed", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
percent-encoding = "2.3"
keyring = { workspace = true }

toml = "1.1"
dirs = { workspace = true }
# Canonicalize paths without the Windows `\\?\` verbatim prefix (std::fs::canonicalize
# adds it), so registry paths match the plain paths the lookup side derives via gix.
dunce = "1"

gix = { version = "0.87.0", default-features = false, features = [
    "sha1",
    "status",
] }
gix-pack = ">=0.69.0"
gix-fs = ">=0.21.1"
gix-transport = ">=0.56.0"

tree-sitter = "0.26"
# Grammar source for the 27 built-in languages (bash, c, cpp, c#, css, dart,
# elixir, go, haskell, hcl, html, java, js, json, kotlin, lua, md, nix, php,
# python, ruby, rust, scala, solidity, swift, tsx, typescript, yaml). One crate
# to bump instead of 13 hand-pinned grammars; kept ABI-aligned to the same
# tree-sitter 0.26 runtime by the ast-grep team. See ts_walker::ts_language.
ast-grep-language = "0.45"
# In-process structural search fallback (replaces the external `ast-grep` binary).
# proto + sql grammars are not shipped by ast-grep-language — kept standalone.
tree-sitter-proto = "0.4"
tree-sitter-sequel = "0.3"

uuid = { workspace = true }
regex = { version = "1", default-features = false, features = ["std"] }
blake3 = "1"
sha2 = "0.11"
hex = "0.4"
ignore = "0.4"
indicatif = "0.18"

docx-rs = { version = "0.4", optional = true }
calamine = { version = "0.36", features = ["dates"], optional = true }
lopdf = { version = "0.44", optional = true }

[[example]]
name = "chunk_quality_eval"
# Without this the example is built by any command that sweeps all targets
# (`cargo test`, `cargo nextest run`, `cargo check --all-targets`) and fails to
# compile, since NativeEmbedder is gated out of core's inkentry-embed dep.
required-features = ["native-embed"]

[dev-dependencies]
proptest = "1"
tempfile = { workspace = true }
wiremock = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
# Only for the chunk_quality_eval example: an independent tokenizer-exact
# token count for the Recall@token-budget metric (avoids reintroducing the
# chars/4 `estimate_tokens` bias the embed_bench harness exists to fix).
tokenizers = { workspace = true }
