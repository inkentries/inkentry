[package]
name = "inkentry-core"
version = "1.2.0"
edition = "2024"
description = "Core library for inkentry — storage, search, embeddings"
license = "MIT"
repository = "https://github.com/inkentries/inkentry"

[features]
default = []
# Exposes in-memory test doubles (e.g. `config::secret_store::MemoryStore`) to
# downstream crates' tests without pulling them into release builds.
test-support = []

[dependencies]
# Trait-only dep (engine-free): owns EmbeddingBackend, re-exported below.
# `default-features = false` keeps the llama.cpp engine out of core and its
# downstream inkentry-cli, which only ever reaches inference over HTTP.
inkentry-embed = { path = "../inkentry-embed", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
reqwest = { workspace = true }
# Named so a TLS handshake failure can be told apart from an unreachable host by
# matching `rustls::Error` in the error chain rather than by string sniffing.
rustls = { workspace = true }
thiserror = { workspace = true }
percent-encoding = "2.3"
keyring = { workspace = true }

toml = "1.1"
dirs = { workspace = true }
# Canonicalize paths without the Windows `\\?\` verbatim prefix (std::fs::canonicalize
# adds it), so registry paths match the plain paths the lookup side derives via gix.
dunce = "1"

gix = { version = "0.90.0", default-features = false, features = [
    "sha1",
    "status",
] }

uuid = { workspace = true }
unicode-normalization = { workspace = true }
regex = { version = "1", default-features = false, features = ["std"] }
blake3 = "1"
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
proptest = "1"
tempfile = { workspace = true }
wiremock = { workspace = true }
serial_test = { workspace = true }
