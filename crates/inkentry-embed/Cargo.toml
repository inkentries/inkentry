[package]
name = "inkentry-embed"
version = "1.0.2"
edition = "2024"
description = "F2LLM-v2-330M embedder (llama.cpp) for inkentry"
license = "MIT"
repository = "https://github.com/inkentries/inkentry"

[lib]
name = "inkentry_embed"
path = "src/lib.rs"

[features]
default = ["llama"]
# llama: the llama.cpp-based LlamaEmbedder (F2LLM-v2-330M, canonical llama.cpp
# GGUF) — the sole embedding engine. The bare feature builds the CPU-only ggml
# backend; add one of the GPU flavors below for hardware acceleration. A
# consumer that only needs the EmbeddingBackend trait + MODEL_ID (inkentry-core,
# so its downstream inkentry-cli isn't statically linking the C++ engine for an
# embedder it only ever calls over HTTP) depends on this crate with
# `default-features = false`.
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:tokio", "dep:tracing"]
# llama-metal: Metal GPU for LlamaEmbedder — the macOS release target.
llama-metal = ["llama", "llama-cpp-2/metal"]
# llama-vulkan: the cross-vendor Windows/Linux GPU target. dynamic-backends
# (GGML_BACKEND_DL) compiles ggml backends as runtime-loaded modules, so one
# binary ships Vulkan + CPU-SIMD variants and degrades to CPU on machines
# without a Vulkan driver. Needs the Vulkan SDK (glslc) at build time only.
llama-vulkan = ["llama", "llama-cpp-2/vulkan", "llama-cpp-2/dynamic-backends"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }
# Resolution anchor only (never imported): pins the sys crate exactly, because
# llama-cpp-2's own caret requirement lets it float to a binding-incompatible
# release. See the pin comment in the workspace root Cargo.toml.
llama-cpp-sys-2 = { workspace = true, optional = true }

[[example]]
name = "embed_bench"
# The example constructs a LlamaEmbedder, so it can't compile without the engine.
# Without this, an --all-targets sweep under --no-default-features tries to build
# it engineless and fails.
required-features = ["llama"]

[dev-dependencies]
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
# The golden-vector gate (tests/golden_vectors.rs) needs a runtime to await the
# async embed and serde_json to read its committed reference.
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde_json = { workspace = true }
# Only for the embed_bench example (surfaces the loader's device-selection log
# line without requiring the caller to export RUST_LOG themselves).
tracing-subscriber = { workspace = true }
# The embed_bench example measures tokenizer-exact sequence lengths.
tokenizers = { workspace = true }
