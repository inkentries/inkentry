# spelunk-server — minimal compose (server + persistent volume)
#
# spelunk-server binds 127.0.0.1 inside its own container (the image's own
# default — see Dockerfile) and refuses to bind a non-loopback address over
# plaintext HTTP, unconditionally, keyed or not (see docs/server.md#trust-model).
#
# Usage:
#   SPELUNK_SERVER_KEY=your-key docker compose up -d

services:
  spelunk-server:
    build: .
    image: spelunk-server:latest
    restart: unless-stopped
    volumes:
      - spelunk-data:/data
    environment:
      SPELUNK_SERVER_KEY: ${SPELUNK_SERVER_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7777/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  spelunk-data:
