# spelunk-server — full stack with Ollama for server-side LLM, behind a TLS
# proxy sidecar (same pattern as docker-compose.yml — see there for why).
#
# NOTE: Ollama GPU passthrough requires Linux + nvidia-container-toolkit.
#       This compose does NOT work on Apple Silicon (Docker runs in a Linux VM).
#       For Mac development, run Ollama natively and use the minimal compose.
#
# Usage (NVIDIA GPU):
#   SPELUNK_SERVER_KEY=your-key docker compose -f docker-compose.full.yml up -d
#
# Usage (CPU-only, slow):
#   SPELUNK_SERVER_KEY=your-key OLLAMA_GPUS= docker compose -f docker-compose.full.yml up -d
#
# Verify:
#   curl -k https://localhost:8443/v1/health

services:
  spelunk-server:
    build: .
    image: spelunk-server:latest
    restart: unless-stopped
    # Published here, not on `proxy` — see docker-compose.yml for why (the
    # network namespace owner must be the one declaring `ports:`; `proxy`
    # only joins this container's namespace and can't also publish).
    # spelunk-server itself still only binds 127.0.0.1:7777 inside that
    # namespace (its own default).
    ports:
      - "8443:8443"
    volumes:
      - spelunk-data:/data
    environment:
      SPELUNK_SERVER_KEY: ${SPELUNK_SERVER_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7777/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - ollama

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Shares spelunk-server's network namespace — see docker-compose.yml.
    # No `ports:` here: a container joining another's namespace can't also
    # publish ports (Docker rejects that combination at container-creation).
    network_mode: "service:spelunk-server"
    depends_on:
      spelunk-server:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  spelunk-data:
  ollama-data:
  caddy-data:
  caddy-config:
