[workspace]
members = [
    "crates/spelunk-core",
    "crates/spelunk-cli",
    "crates/spelunk-embed",
    "crates/spelunk-server",
]
resolver = "2"

[workspace.dependencies]
anyhow      = "1"
async-trait = "0.1"
chrono      = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror   = "2"
rusqlite    = { version = "0.40", features = ["bundled"] }
sqlite-vec  = "0.1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# In-process HTTPS for spelunk-server (ADR-066). `tls-rustls-no-provider` avoids
# rustls' default aws-lc-rs provider (needs cmake/C/NASM); ring is installed at
# startup instead — already the resolved provider via reqwest/hf-hub.
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
uuid        = { version = "1", features = ["v4", "v7", "serde"] }
tempfile    = "3"
pretty_assertions = "1"
serial_test = "3"
wiremock    = "0.6"
dirs        = "6"
# Native embedder stack (F2LLM-v2-330M via candle). Depended on unconditionally
# by the `spelunk-embed` crate; versions pinned here so the candle trio stays on
# one runtime line.
candle-core = "0.11.0"
candle-nn   = "0.11.0"
candle-transformers = "0.11.0"
tokenizers  = "0.23"
# OS keychain for the CLI bearer credential (macOS Keychain, Linux Secret
# Service, Windows Credential Manager). `apple-native` / `windows-native` use
# the platform store directly; `sync-secret-service` covers Linux. The `mock`
# feature provides an in-memory backend used by tests so CI needs no daemon.
keyring     = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[profile.release]
lto           = true
codegen-units = 1
opt-level     = 3
