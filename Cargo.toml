[workspace]
members = [
    "crates/spelunk-core",
    "crates/spelunk-cli",
    "crates/spelunk-server",
]
resolver = "2"

[workspace.dependencies]
anyhow      = "1"
async-trait = "0.1"
chrono      = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite    = { version = "0.40", features = ["bundled"] }
sqlite-vec  = "0.1"
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
uuid        = { version = "1", features = ["v4", "v7", "serde"] }
tempfile    = "3"
pretty_assertions = "1"
serial_test = "3"
wiremock    = "0.6"
# OS keychain for the CLI bearer credential (macOS Keychain, Linux Secret
# Service, Windows Credential Manager). `apple-native` / `windows-native` use
# the platform store directly; `sync-secret-service` covers Linux. The `mock`
# feature provides an in-memory backend used by tests so CI needs no daemon.
keyring     = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

[profile.release]
lto           = true
codegen-units = 1
opt-level     = 3
